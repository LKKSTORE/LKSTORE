<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0b;
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 18px;
background:#111;
border-bottom:1px solid #222;
position:sticky;
top:0;
}

.logo{
color:#ff3b3b;
font-size:22px;
font-weight:900;
}

/* ICONS */
.topIcons{
display:flex;
gap:12px;
align-items:center;
}

.icon{
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:#222;
position:relative;
}

.icon.cart{
background:#ff3b3b;
}

/* contador */
#cartCount{
position:absolute;
top:-5px;
right:-5px;
background:white;
color:black;
font-size:12px;
width:18px;
height:18px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

/* SEARCH */
.searchBox{
text-align:center;
padding:20px;
}

.searchBox input{
padding:10px;
width:80%;
max-width:400px;
border-radius:8px;
border:none;
outline:none;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#151515;
border:1px solid #222;
padding:18px;
border-radius:12px;
text-align:center;
transition:0.2s;
}

.card:hover{
transform:translateY(-4px);
border-color:#ff3b3b;
}

.card h3{
color:#ff3b3b;
margin-bottom:10px;
}

.card button{
background:#ff3b3b;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
border-radius:8px;
width:100%;
}

/* CART */
#cartBox{
position:fixed;
right:-300px;
top:70px;
width:260px;
height:420px;
background:#111;
border-left:2px solid #ff3b3b;
padding:15px;
transition:0.3s;
overflow:auto;
z-index:999;
}

#cartBox h3{
color:#ff3b3b;
margin-bottom:10px;
}

#cartItems p{
display:flex;
justify-content:space-between;
font-size:14px;
margin:6px 0;
}

/* CHECKOUT */
#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:12px;
width:320px;
z-index:9999;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>

<div class="topIcons">

<!-- PERFIL -->
<div class="icon" onclick="alert('Perfil em breve')">👤</div>

<!-- CARRINHO -->
<div class="icon cart" onclick="toggleCart()">
🛒
<span id="cartCount">0</span>
</div>

</div>
</header>

<!-- SEARCH -->
<div class="searchBox">
<input id="search" onkeyup="filtrar()" placeholder="Buscar produtos...">
</div>

<!-- PRODUCTS -->
<section class="products">

<div class="card item">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',6)">Comprar R$6</button>
</div>

<div class="card item">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',4)">Comprar R$4</button>
</div>

<div class="card item">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',7)">Comprar R$7</button>
</div>

</section>

<!-- CART -->
<div id="cartBox">

<h3>Carrinho</h3>

<div id="cartItems"></div>

<p style="margin-top:10px;">
Total: R$ <span id="total">0</span>
</p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;margin-top:10px;">
Finalizar
</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<button onclick="fecharCheckout()" style="padding:10px;background:red;color:white;">
Fechar
</button>

</div>

<!-- SUPORTE -->
<a href="https://wa.me/5582991585655"
style="position:fixed;bottom:20px;right:20px;background:#25D366;padding:14px;border-radius:50px;color:white;text-decoration:none;">
💬 Suporte
</a>

<script>

let cart=[];

/* ADD */
function addToCart(n,p){
cart.push({n,p});
update();
}

/* TOGGLE CART */
function toggleCart(){
let box=document.getElementById("cartBox");

if(box.style.right==="0px"){
box.style.right="-300px";
}else{
box.style.right="0px";
}
}

/* UPDATE */
function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let t=0;

cart.forEach((i,index)=>{
t+=i.p;

box.innerHTML+=`
<p>
${i.n} - R$ ${i.p}
<span onclick="removeItem(${index})" style="color:red;cursor:pointer;">✖</span>
</p>`;
});

document.getElementById("total").innerText=t;
document.getElementById("cartCount").innerText=cart.length;
}

/* REMOVE */
function removeItem(index){
cart.splice(index,1);
update();
}

/* CHECKOUT */
function abrirCheckout(){
document.getElementById("checkoutBox").style.display="block";

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
box.innerHTML+=`<p>${i.n} - R$ ${i.p}</p>`;
t+=i.p;
});

document.getElementById("checkoutTotal").innerText=t;
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

/* SEARCH */
function filtrar(){
let input=document.getElementById("search").value.toLowerCase();
let items=document.querySelectorAll(".item");

items.forEach(item=>{
let text=item.innerText.toLowerCase();

if(text.includes(input)){
item.style.display="block";
}else{
item.style.display="none";
}
});
}

</script>

</body>
                                                </html>
