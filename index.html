<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:999;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:22px;
}

.topIcons{
  display:flex;
  align-items:center;
}

.cartBtn{
  background:red;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  display:flex;
  gap:6px;
  align-items:center;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
}

.card img{
  height:70px;
}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* CARRINHO LATERAL */
#cartBox{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#111;
  z-index:1000;
  padding:15px;
  transition:0.3s;
  box-shadow:-5px 0 20px rgba(0,0,0,0.5);
}

#cartBox.open{
  right:0;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  border-bottom:1px solid #222;
  padding-bottom:5px;
}

.remove{
  color:red;
  cursor:pointer;
}

.finalizar{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" onclick="toggleCart()"></div>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LKSTORE LOGIN</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE</div>

  <div class="topIcons">
    <div class="cartBtn" onclick="toggleCart()">
      🛒 <span id="count">0</span>
    </div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify')">Comprar</button>
  </div>

</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <button class="finalizar" onclick="finalizar()">Finalizar Compra</button>
</div>

<script>

let carrinho = [];
let logado = false;

/* LOGIN */
function register(){
  let u = user.value;
  let p = pass.value;
  localStorage.setItem("user_"+u,p);
  alert("Conta criada!");
}

function login(){
  let u = user.value;
  let p = pass.value;

  if(localStorage.getItem("user_"+u) === p){
    logado = true;
    authBox.style.display = "none";
  } else {
    alert("Login inválido");
  }
}

/* ADD */
function add(prod){
  if(!logado){
    alert("Crie uma conta e faça login!");
    return;
  }

  carrinho.push(prod);
  count.innerText = carrinho.length;
  renderCart();
}

/* TOGGLE CART */
function toggleCart(){
  const cart = document.getElementById("cartBox");
  const overlay = document.getElementById("overlay");

  cart.classList.toggle("open");

  overlay.style.display = cart.classList.contains("open") ? "block" : "none";

  renderCart();
}

/* RENDER */
function renderCart(){
  cartItems.innerHTML = "";

  carrinho.forEach((item, i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${item}
        <span class="remove" onclick="removeItem(${i})">x</span>
      </div>
    `;
  });
}

/* REMOVE */
function removeItem(i){
  carrinho.splice(i,1);
  count.innerText = carrinho.length;
  renderCart();
}

/* FINALIZAR */
function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  count.innerText = 0;
  renderCart();
  toggleCart();
}

</script>

</body>
</html>
