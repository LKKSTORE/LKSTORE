<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  (function(){
    emailjs.init("SUA_PUBLIC_KEY_AQUI");
  })();
</script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:linear-gradient(120deg,#2b0000,#8b0000,#000);
background-size:200% 200%;
animation:bgMove 8s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
display:flex;
justify-content:space-between;
padding:18px 40px;
background:rgba(0,0,0,0.7);
position:sticky;
top:0;
}

.logo{
color:red;
font-size:26px;
font-weight:900;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
}

#cartBox{
position:fixed;
right:20px;
top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:240px;
}

#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:10px;
width:320px;
z-index:9999;
}

.support{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:14px 18px;
border-radius:50px;
color:white;
text-decoration:none;
font-weight:bold;
}

#pixBox{
position:fixed;
bottom:90px;
right:20px;
background:#111;
padding:15px;
border-radius:10px;
width:220px;
display:none;
}

button{cursor:pointer;}

</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<section class="products">

<div class="card">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',29)">Comprar</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',49)">Comprar</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',99)">Comprar</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">

<h3 style="color:red;">Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;color:black;border:none;font-weight:bold;">
Checkout
</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>🧾 Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<hr>

<h3>💳 PIX</h3>

<p id="pixKey">82991585655</p>

<button onclick="copiarPix()" style="width:100%;padding:8px;background:red;color:white;border:none;">
Copiar Pix
</button>

<img style="width:100%;margin-top:10px;"
src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PIX-82991585655">

<br><br>

<button onclick="confirmarCompra()" style="width:100%;padding:10px;background:green;color:white;border:none;">
Confirmar Compra
</button>

<button onclick="fecharCheckout()" style="width:100%;padding:10px;background:red;color:white;border:none;margin-top:5px;">
Fechar
</button>

</div>

<!-- SUPORTE -->
<a class="support" href="https://wa.me/5582991585655?text=Preciso de suporte na LKSTORE" target="_blank">
💬 Suporte
</a>

<script>

let cart = [];
let total = 0;

/* CARRINHO */
function addToCart(name,price){
cart.push({name,price});
updateCart();
}

function updateCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
total=0;

cart.forEach((item,i)=>{
total+=item.price;

box.innerHTML+=`
<p>
${item.name} - R$ ${item.price}
<button onclick="removeItem(${i})">X</button>
</p>
`;
});

document.getElementById("total").innerText=total;
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

/* CHECKOUT */
function abrirCheckout(){
if(cart.length===0){
alert("Carrinho vazio!");
return;
}

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let total=0;

cart.forEach(item=>{
box.innerHTML+=`<p>${item.name} - R$ ${item.price}</p>`;
total+=item.price;
});

document.getElementById("checkoutTotal").innerText=total;
document.getElementById("checkoutBox").style.display="block";
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

/* PIX */
function copiarPix(){
navigator.clipboard.writeText("82991585655");
alert("PIX copiado!");
}

/* COMPRA + EMAIL + ADMIN */
function confirmarCompra(){

let total=0;
let msg="";

cart.forEach(item=>{
msg+=`${item.name} - R$ ${item.price}\n`;
total+=item.price;
});

// ADMIN (LOCAL)
let pedidos=JSON.parse(localStorage.getItem("pedidos")||"[]");
pedidos.push({items:cart,total:total,date:new Date().toLocaleString()});
localStorage.setItem("pedidos",JSON.stringify(pedidos));

// EMAIL (EMAILJS)
let email=prompt("Digite seu e-mail:");

emailjs.send("SUA_SERVICE_ID","SUA_TEMPLATE_ID",{
to_email:email,
message:msg,
total:total
});

alert("Compra confirmada!");

cart=[];
updateCart();
fecharCheckout();
}

</script>

</body>
</html>
