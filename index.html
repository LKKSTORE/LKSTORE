<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:linear-gradient(-45deg,#2b0000,#ff0000,#000);
background-size:400% 400%;
animation:bg 6s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
display:flex;
justify-content:space-between;
padding:18px;
background:rgba(0,0,0,0.7);
position:sticky;
top:0;
}

.logo{
color:red;
font-size:26px;
font-weight:900;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:rgba(0,0,0,0.85);
padding:20px;
border-radius:12px;
text-align:center;
border:1px solid red;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
border-radius:8px;
}

#cartBox{
position:fixed;
right:20px;
top:20px;
background:black;
padding:15px;
border-radius:10px;
width:250px;
border:1px solid red;
}

#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:10px;
width:320px;
z-index:9999;
}

#authBox{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

button{cursor:pointer;}

</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<!-- PRODUTOS -->
<section class="products">

<div class="card">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',6)">Comprar - R$ 6</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',4)">Comprar - R$ 4</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',7)">Comprar - R$ 7</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">

<h3 style="color:red;">Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;">
Checkout
</button>

<button onclick="gerarPagamento()" style="width:100%;padding:10px;background:green;color:white;">
Pagar PagSeguro
</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<button onclick="fecharCheckout()" style="padding:10px;background:red;color:white;">
Fechar
</button>

</div>

<!-- LOGIN -->
<div id="authBox">

<h2 style="color:red;">LOGIN</h2>

<input id="loginUser" placeholder="Usuário" style="padding:10px;margin:5px;">
<input id="loginPass" type="password" placeholder="Senha" style="padding:10px;margin:5px;">

<button onclick="login()" style="padding:10px;background:red;color:white;width:100%;">
Entrar
</button>

</div>

<!-- SUPORTE -->
<a href="https://wa.me/5582991585655"
style="position:fixed;bottom:20px;right:20px;background:#25D366;padding:14px;border-radius:50px;color:white;text-decoration:none;">
💬 Suporte
</a>

<script>

let cart=[];

/* LOGIN */
function login(){
let u=document.getElementById("loginUser").value;
let p=document.getElementById("loginPass").value;

if(u && p){
localStorage.setItem("logado","1");
document.getElementById("authBox").style.display="none";
}
}

/* CARRINHO */
function addToCart(n,p){
cart.push({n,p});
update();
}

function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let t=0;

cart.forEach((i,index)=>{
t+=i.p;

box.innerHTML+=`
<p>
${i.n} - R$ ${i.p}
<button onclick="removeItem(${index})"
style="margin-left:10px;background:red;color:white;border:none;padding:3px;">
X
</button>
</p>`;
});

document.getElementById("total").innerText=t;
}

/* REMOVE ITEM */
function removeItem(index){
cart.splice(index,1);
update();
}

/* CHECKOUT */
function abrirCheckout(){
document.getElementById("checkoutBox").style.display="block";

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
box.innerHTML+=`<p>${i.n} - R$ ${i.p}</p>`;
t+=i.p;
});

document.getElementById("checkoutTotal").innerText=t;
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

/* PAGSEGURO */
function gerarPagamento(){

if(cart.length===0){
alert("Carrinho vazio");
return;
}

let total = cart.reduce((a,b)=>a + b.p, 0);

alert("Total: R$ " + total);

window.open("https://pag.ae/81R2Yyh2N", "_blank");
}

</script>

</body>
</html>
