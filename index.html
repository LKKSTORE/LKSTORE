<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0b;
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:16px 20px;
background:#111;
border-bottom:1px solid #222;
position:sticky;
top:0;
}

.logo{
color:#ff3b3b;
font-size:24px;
font-weight:900;
}

/* SEARCH */
.searchBox{
text-align:center;
padding:20px;
}

.searchBox input{
padding:10px;
width:80%;
max-width:400px;
border-radius:8px;
border:none;
}

/* PRODUTOS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#151515;
border:1px solid #222;
padding:18px;
border-radius:12px;
text-align:center;
transition:0.2s;
}

.card:hover{
transform:translateY(-4px);
border-color:#ff3b3b;
}

.card h3{
color:#ff3b3b;
margin-bottom:10px;
}

.card button{
background:#ff3b3b;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
border-radius:8px;
width:100%;
}

.card button:hover{
background:#cc2f2f;
}

/* CARRINHO */
#cartBox{
position:fixed;
right:15px;
top:80px;
background:#111;
padding:15px;
border-radius:12px;
width:260px;
border:1px solid #222;
}

#cartBox h3{
color:#ff3b3b;
margin-bottom:10px;
}

#cartItems p{
font-size:14px;
margin:6px 0;
}

/* CHECKOUT */
#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:12px;
width:320px;
z-index:9999;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<!-- SEARCH -->
<div class="searchBox">
<input id="search" onkeyup="filtrar()" placeholder="Buscar produtos...">
</div>

<!-- PRODUTOS -->
<section class="products">

<div class="card item">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',6)">Comprar - R$ 6</button>
</div>

<div class="card item">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',4)">Comprar - R$ 4</button>
</div>

<div class="card item">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',7)">Comprar - R$ 7</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">

<h3>Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;">
Checkout
</button>

<button onclick="gerarPagamento()" style="width:100%;padding:10px;background:green;color:white;">
Pagar
</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<button onclick="fecharCheckout()" style="padding:10px;background:red;color:white;">
Fechar
</button>

</div>

<!-- SUPORTE -->
<a href="https://wa.me/5582991585655"
style="position:fixed;bottom:20px;right:20px;background:#25D366;padding:14px;border-radius:50px;color:white;text-decoration:none;">
💬 Suporte
</a>

<script>

let cart=[];

/* ADD */
function addToCart(n,p){
cart.push({n,p});
update();
}

/* UPDATE */
function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let t=0;

cart.forEach((i,index)=>{
t+=i.p;

box.innerHTML+=`
<p>
${i.n} - R$ ${i.p}
<button onclick="removeItem(${index})"
style="margin-left:10px;background:red;color:white;border:none;padding:3px;">
X
</button>
</p>`;
});

document.getElementById("total").innerText=t;
}

/* REMOVE */
function removeItem(index){
cart.splice(index,1);
update();
}

/* CHECKOUT */
function abrirCheckout(){
document.getElementById("checkoutBox").style.display="block";

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
box.innerHTML+=`<p>${i.n} - R$ ${i.p}</p>`;
t+=i.p;
});

document.getElementById("checkoutTotal").innerText=t;
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

/* PAGAMENTO */
function gerarPagamento(){

if(cart.length===0){
alert("Carrinho vazio");
return;
}

let total = cart.reduce((a,b)=>a + b.p, 0);

const links = [
"https://pag.ae/81R2Yyh2N",
"https://pag.ae/81R2Yyh2N",
"https://pag.ae/81R2Yyh2N"
];

let index = 0;

if(total <= 4){
index = 0;
}
else if(total <= 6){
index = 1;
}
else{
index = 2;
}

alert("Total: R$ " + total);

window.open(links[index], "_blank");
}

/* BUSCA */
function filtrar(){
let input=document.getElementById("search").value.toLowerCase();
let items=document.querySelectorAll(".item");

items.forEach(item=>{
let text=item.innerText.toLowerCase();

if(text.includes(input)){
item.style.display="block";
}else{
item.style.display="none";
}
});
}

</script>

</body>
</html>
