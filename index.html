<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

/* FUNDO BONITO */
body{
background: linear-gradient(120deg, #2b0000, #8b0000, #000000);
background-size:200% 200%;
animation:bgMove 8s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:18px 40px;
background:rgba(0,0,0,0.7);
position:sticky;
top:0;
}

.logo{
color:red;
font-size:26px;
font-weight:900;
}

/* PRODUTOS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
}

/* CARRINHO */
#cartBox{
position:fixed;
right:20px;
top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:240px;
}

/* BOTÃO SUporte */
.support{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:14px 18px;
border-radius:50px;
color:white;
text-decoration:none;
font-weight:bold;
}

/* PIX BOX */
#pixBox{
position:fixed;
bottom:90px;
right:20px;
background:#111;
padding:15px;
border-radius:10px;
width:220px;
}

</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<section class="products">

<div class="card">
<h3>Premium 1</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 1',29)">Comprar</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 2',49)">Comprar</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 3',99)">Comprar</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">

<h3 style="color:red;">Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="finalizarWhatsApp()" style="margin-top:10px;width:100%;padding:10px;background:green;color:white;border:none;">
Finalizar no WhatsApp
</button>

<button onclick="mostrarPix()" style="margin-top:8px;width:100%;padding:10px;background:#ff1a1a;color:white;border:none;">
Ver Pix
</button>

</div>

<!-- PIX -->
<div id="pixBox" style="display:none;">
<h3 style="color:#ff1a1a;">PIX</h3>
<p id="pixKey" style="color:#00ff99;">82991585655</p>

<button onclick="copiarPix()" style="margin-top:5px;width:100%;padding:8px;background:#444;color:white;border:none;">
Copiar PIX
</button>
</div>

<!-- SUPORTE -->
<a class="support" href="https://wa.me/5582991585655?text=Olá! Preciso de suporte na LKSTORE" target="_blank">
💬 Suporte
</a>

<script>

let cart = [];
let total = 0;

/* CARRINHO */
function addToCart(name,price){
cart.push({name,price});
updateCart();
}

function updateCart(){
let box = document.getElementById("cartItems");
box.innerHTML="";
total=0;

cart.forEach((item,i)=>{
total+=item.price;

box.innerHTML+=`
<p>
${item.name} - R$ ${item.price}
<button onclick="removeItem(${i})">X</button>
</p>
`;
});

document.getElementById("total").innerText=total;
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

/* WHATSAPP */
function finalizarWhatsApp(){
if(cart.length===0){
alert("Carrinho vazio!");
return;
}

let msg="Olá! Quero comprar:%0A";
let total=0;

cart.forEach(item=>{
msg+=`- ${item.name} R$ ${item.price}%0A`;
total+=item.price;
});

msg+=`%0ATotal: R$ ${total}`;

let numero="5582991585655";

window.open(`https://wa.me/${numero}?text=${msg}`,"_blank");
}

/* PIX */
function mostrarPix(){
let box=document.getElementById("pixBox");
box.style.display=box.style.display==="none"?"block":"none";
}

function copiarPix(){
navigator.clipboard.writeText(document.getElementById("pixKey").innerText);
alert("PIX copiado!");
}

</script>

</body>
</html>
