<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
min-height:100vh;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
font-weight:900;
color:#ff3b3b;
}

/* ICONES */

.topIcons{
display:flex;
gap:10px;
}

.icon{
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:#222;
position:relative;
transition:.3s;
}

.icon:hover{
transform:scale(1.05);
}

.cart{
background:#ff3b3b;
}

#cartCount{
position:absolute;
top:-5px;
right:-5px;
background:white;
color:black;
width:18px;
height:18px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* BUSCA */

.searchBox{
padding:20px;
text-align:center;
}

.searchBox input{
width:90%;
max-width:450px;
padding:12px;
border:none;
border-radius:10px;
outline:none;
}

/* PRODUTOS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:25px;
}

.card{
background:#151515;
border:1px solid #222;
padding:20px;
border-radius:12px;
text-align:center;
transition:.3s;
}

.card:hover{
border-color:#ff3b3b;
transform:translateY(-5px);
}

.card h3{
color:#ff3b3b;
margin-bottom:10px;
}

.card p{
margin-bottom:10px;
}

.card button{
width:100%;
padding:10px;
border:none;
background:#ff3b3b;
color:white;
border-radius:8px;
cursor:pointer;
}

button{
cursor:pointer;
  /* CARRINHO */

function login(){

function register(){

/* CARRINHO */

function addToCart(n,p){

cart.push({n,p});

update();

}

function toggleCart(){

let box=document.getElementById("cartBox");

if(box.style.right==="0px"){

box.style.right="-300px";

}else{

box.style.right="0px";

}

}

function update(){

let box=document.getElementById("cartItems");

box.innerHTML="";

let total=0;

cart.forEach((i,index)=>{

total+=i.p;

box.innerHTML+=`
<p>
${i.n} - R$ ${i.p}
<span
onclick="removeItem(${index})"
style="color:red;cursor:pointer;">
✖
</span>
</p>
`;

});

document.getElementById("total").innerText=total;
document.getElementById("cartCount").innerText=cart.length;

}

function removeItem(index){

cart.splice(index,1);

update();

}
