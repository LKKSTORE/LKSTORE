<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0b;
  color: white;
  padding-top: 80px;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-between;
  padding: 15px;
  z-index: 1000;
}

.logo {
  color: #00ff88;
  font-weight: bold;
  font-size: 20px;
}

.topIcons {
  display: flex;
  gap: 15px;
  align-items: center;
}

.icon {
  cursor: pointer;
  font-size: 22px;
}

/* PRODUTOS */
.products {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: #111;
  width: 180px;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}

.card img {
  height: 60px;
  margin-bottom: 10px;
}

.card button {
  background: #00ff88;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* BANNERS */
.bannerLK {
  background: #111;
  margin: 10px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* TAMANHOS DOS TEXTOS */
.grande {
  font-size: 22px;
  font-weight: bold;
}

.medio {
  font-size: 18px;
}

.pequeno {
  font-size: 14px;
  opacity: 0.9;
}

/* LOGIN */
#authBox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.authCard {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 350px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.authCard input {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

/* CARRINHO */
#cartBox {
  display: none;
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  z-index: 2000;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #00ff88;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2>LKSTORE LOGIN</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar Conta</button>

    <p id="msg"></p>
  </div>
</div>

<header>
  <div class="logo">LKSTORE</div>
  <div class="topIcons">
    <div>🛒 <span id="count">0</span></div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
  
    <button onclick="add('Netflix', 19.90)">Comprar</button>
  </div>
<div class="products">

  <!-- JÁ EXISTENTES -->
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix', 19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+', 15.90)">Comprar</button>
  </div>

  <!-- NOVOS QUE VOCÊ ADICIONOU -->
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video', 14.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Paramount%2B_logo.svg">
    <h3>Premiere</h3>
    <button onclick="add('Premiere', 19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify', 9.90)">Comprar</button>
  </div>

</div>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+', 15.90)">Comprar</button>
  </div>

</div>

<!-- AVISOS COM TAMANHO -->
<div style="margin-top:40px;">

  <div class="bannerLK grande">🔒 PAGAMENTO 100% SEGURO</div>

  <div class="bannerLK medio">⚡ ENTREGA IMEDIATA APÓS CONFIRMAÇÃO</div>

  <div class="bannerLK pequeno">💬 SUPORTE VIA WHATSAPP</div>

</div>

<script>
let carrinho = [];
let logado = false;

/* LOGIN */
function register() {
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  localStorage.setItem("user_"+u, p);
  alert("Conta criada!");
}

function login() {
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("user_"+u) === p) {
    logado = true;
    document.getElementById("authBox").style.display = "none";
  } else {
    document.getElementById("msg").innerText = "Login inválido";
  }
}

/* CARRINHO */
function add(nome, preco) {
  if(!logado) {
    alert("Faça login primeiro!");
    return;
  }

  carrinho.push({nome, preco});
  document.getElementById("count").innerText = carrinho.length;
}
</script>

</body>
</html>
