<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}

.iaBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:red;
  padding:15px;
  border-radius:50%;
  cursor:pointer;
  z-index:99999;
}
</style>
</head>

<body>

<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<header>
  <div class="logo">LKSTORE PRO</div>
  <div class="topIcons">
    <div onclick="openPerfil()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
  </div>
</header>

<div id="avisoLoja" class="banner">🔥 Bem-vindo à LKSTORE</div>

<div class="products"></div>

<div id="modalProduto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;">
  <div style="background:#fff;padding:20px;border-radius:10px;width:300px;">
    <h3>Produto</h3>
    <input id="nomeP" placeholder="Nome">
    <input id="precoP" placeholder="Preço">
    <input id="imgP" placeholder="Imagem URL">
    <button onclick="salvarProduto()">Salvar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<div id="perfil" style="display:none;position:fixed;inset:0;background:#000000ee;padding:20px;">
  <div style="background:#111;padding:20px;border-radius:10px;max-width:400px;margin:auto;">
    <h3>Perfil</h3>
    <p id="userLog"></p>
    <button onclick="logout()">Sair</button>
    <button onclick="closePerfil()">Fechar</button>
  </div>
</div>

<div class="iaBtn" onclick="ia()">🤖</div>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let userLogado = "";
let isAdmin = false;
let carrinho = [];

const ADMIN_EMAIL = "ls4619058@gmail.com";

function register(){
  let u = user.value;
  let p = pass.value;
  if(!u||!p) return alert("Preencha");
  localStorage.setItem("u_"+u,p);
  alert("Conta criada");
}

function loginUser(){
  let u = user.value;
  let p = pass.value;

  if(localStorage.getItem("u_"+u) === p){
    userLogado = u;
    isAdmin = (u === ADMIN_EMAIL);
    userLogin.style.display="none";
    render();
  } else alert("Erro login");
}

function logout(){
  userLogado="";
  isAdmin=false;
  userLogin.style.display="flex";
}

function render(){
  let c = document.querySelector(".products");
  c.innerHTML="";

  produtos.forEach(p=>{
    c.innerHTML += `
      <div class="card">
        ${p.img?`<img src="${p.img}" width="100%">`:''}
        <h4>${p.nome}</h4>
        <p>R$ ${p.preco}</p>

        ${!p.esgotado?`<button onclick="comprar()">Comprar</button>`:''}

        ${isAdmin?`
          <button onclick="editar(${p.id})">Editar</button>
          <button onclick="trocarImg(${p.id})">Imagem</button>
          <button onclick="toggle(${p.id})">Esgotar</button>
          <button onclick="remover(${p.id})">Remover</button>
        `:''}
      </div>
    `;
  });
}

function comprar(){
  window.open("https://link.mercadopago.com.br/lkkstore","_blank");
}

function salvarProduto(){
  produtos.push({
    id:Date.now(),
    nome:nomeP.value,
    preco:precoP.value,
    img:imgP.value,
    esgotado:false
  });
  localStorage.setItem("produtos",JSON.stringify(produtos));
  fecharModal();
  render();
}

function fecharModal(){modalProduto.style.display="none";}

function toggle(id){
  produtos = produtos.map(p=>{
    if(p.id===id)p.esgotado=!p.esgotado;
    return p;
  });
  localStorage.setItem("produtos",JSON.stringify(produtos));
  render();
}

function remover(id){
  produtos = produtos.filter(p=>p.id!==id);
  localStorage.setItem("produtos",JSON.stringify(produtos));
  render();
}

function editar(id){
  let p = produtos.find(x=>x.id===id);
  let n = prompt("Nome",p.nome);
  let pr = prompt("Preço",p.preco);
  if(n&&pr){
    p.nome=n; p.preco=pr;
    localStorage.setItem("produtos",JSON.stringify(produtos));
    render();
  }
}

function trocarImg(id){
  let p = produtos.find(x=>x.id===id);
  let i = prompt("URL imagem",p.img);
  if(i){
    p.img=i;
    localStorage.setItem("produtos",JSON.stringify(produtos));
    render();
  }
}

function openPerfil(){
  perfil.style.display="block";
  userLog.innerText="Usuário: "+userLogado;
}

function closePerfil(){perfil.style.display="none";}

function openCart(){
  alert(carrinho.join(", "));
}

function ia(){
  let q = prompt("Pergunte à LK IA:");
  if(!q) return;

  q = q.toLowerCase();

  if(q.includes("preço")){
    alert("Veja os preços na loja.");
  } else if(q.includes("netflix")){
    alert("Temos Netflix disponível!");
  } else {
    alert("Ainda estou aprendendo 🤖");
  }
}

render();

</script>

</body>
</html>
