<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{
  display:flex;
  gap:12px;
  align-items:center;
}

.topIcons div{
  cursor:pointer;
  font-size:22px;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

/* LOGIN */
.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

/* BOTÕES */
.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

/* SIDE PANEL PERFIL */
.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:3000;
}

.sidePanel.open{right:0;}

.close{
  float:right;
  cursor:pointer;
}

.menu div{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

/* ADMIN */
#adminPanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  border-left:2px solid red;
  z-index:5000;
}

#adminPanel.open{right:0;}

/* BANNER */
.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}

/* ===== CARRINHO NOVO ===== */
.cartPanel{
  position:fixed;
  top:0;
  right:0;
  width:320px;
  height:100%;
  background:#111;
  padding:15px;
  z-index:6000;

  transform:translateX(100%);
  transition:0.35s ease;
}

.cartPanel.open{
  transform:translateX(0);
}

.cartItem{
  background:#222;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

/* overlay */
.cartOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:5900;
}

.cartOverlay.active{
  opacity:1;
  pointer-events:all;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>

 <button class="btn gray" onclick="openAdminLogin()">⚙️ Login Admin</button>
  </div>
</div>

<!-- ADMIN LOGIN -->

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="screen" style="display:none;">
  <div class="box">
    <h3>LOGIN ADMIN</h3>
    <input id="adminPass" type="password">
    <button class="btn red" onclick="loginAdmin()">Entrar</button>
    <button class="btn gray" onclick="closeAdminLogin()">Voltar</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openProfile()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
    <div id="adminBtn" onclick="openAdmin()" style="display:none;">⚙️</div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">
  <div class="card">
    Netflix
    <button class="btn red" onclick="add('Netflix')">Comprar</button>
  </div>
</div>
<!-- PERFIL -->
<div id="profile" class="sidePanel">
  <span class="close" onclick="openProfile()">✖</span>

  <h3>👤 Perfil</h3>
  <p>Usuário: <span id="userName">---</span></p>

  <div class="menu">
    <div>🧾 Minha conta</div>
    <div>🛒 Minhas compras</div>
    <div onclick="afiliado()">🤝 Afiliado</div>
    <div onclick="logout()" style="color:red;">🚪 Sair</div>
  </div>

  <p id="dono" style="display:none;color:gray;margin-top:10px;">
    Dono: ls4619058@gmail.com
  </p>
</div>

<!-- ADMIN -->
<div id="adminPanel">
  <span class="close" onclick="openAdmin()">✖</span>

  <h3>⚙️ Painel Admin</h3>

  <p id="adminStatus">Bloqueado</p>

  <input id="nomeProd" placeholder="Nome do produto">

  <input id="precoProd" placeholder="Preço">

  <input id="imgProd" placeholder="URL da imagem">

  <button class="btn red" onclick="adicionarProduto()">
    Adicionar Produto
  </button>
</div>

<!-- CARRINHO -->
<div class="cartOverlay" onclick="openCart()"></div>

<div id="cartPanel" class="cartPanel">
  <h3>🛒 Carrinho</h3>
  <div id="cartItems"></div>
  <hr>
  <p>Total: <span id="total">0</span></p>
</div>

<!-- BANNERS -->
<div class="banner">🔒 Seguro</div>
<div class="banner">⚡ Entrega automática</div>
<div class="banner">💬 Suporte 24h</div>

<script>

function loginUser(){

  let usuario = document.getElementById("user").value;
  let senha = document.getElementById("pass").value;

  if(localStorage.getItem("u_" + usuario) === senha){

    userLogado = usuario;

    document.getElementById("userLogin").style.display = "none";
    document.getElementById("userName").innerText = usuario;

    // Libera admin somente para o dono
    if(usuario === "ls4619058@gmail.com"){
      isAdmin = true;
      document.getElementById("adminBtn").style.display = "block";
      document.getElementById("dono").style.display = "block";
      document.getElementById("adminStatus").innerText = "LIBERADO ✔";
    }

  } else {
    alert("Login inválido");
  }
}
  
  
  function adicionarProduto(){

  let nome = document.getElementById("nomeProd").value;
  let preco = document.getElementById("precoProd").value;
  let img = document.getElementById("imgProd").value;

  if(nome == "" || preco == ""){
    alert("Preencha os campos");
    return;
  }

  document.querySelector(".products").innerHTML += `
    <div class="card">
      ${img ? `<img src="${img}" width="100%">` : ""}
      <h4>${nome}</h4>
      <p>R$ ${preco}</p>
      <button class="btn red" onclick="add('${nome}')">
        Comprar
      </button>
    </div>
  `;

  alert("Produto adicionado!");

  document.getElementById("nomeProd").value="";
  document.getElementById("precoProd").value="";
  document.getElementById("imgProd").value="";
}
  
let isAdmin = false;
let userLogado = "";
let carrinho = [];

const ADMIN_PASS = "1234";

function register(){

  let usuario = document.getElementById("user").value;
  let senha = document.getElementById("pass").value;

  if(usuario === "" || senha === ""){
    alert("Preencha usuário e senha");
    return;
  }

  localStorage.setItem("u_" + usuario, senha);

  alert("Conta criada com sucesso!");
}

function loginUser(){

  let usuario = document.getElementById("user").value;
  let senha = document.getElementById("pass").value;

  if(localStorage.getItem("u_" + usuario) === senha){

    userLogado = usuario;

    document.getElementById("userLogin").style.display = "none";

    document.getElementById("userName").innerText = usuario;

  } else {
    alert("Login inválido");
  }
}
 
/*ADMIN */
function openAdminLogin(){
  document.getElementById("adminLogin").style.display = "flex";
}

function closeAdminLogin(){
  document.getElementById("adminLogin").style.display = "none";
}

function loginAdmin(){
  let pass = document.getElementById("adminPass").value;

  if(pass === ADMIN_PASS){
    isAdmin = true;
    document.getElementById("adminBtn").style.display = "block";
    document.getElementById("adminStatus").innerText = "LIBERADO ✔";
    document.getElementById("dono").style.display = "block";
    closeAdminLogin();
    alert("Admin liberado!");
  } else {
    alert("Senha errada");
  }
}

function openAdmin(){
  if(!isAdmin){
    alert("Acesso negado");
    return;
  }
  document.getElementById("adminPanel").classList.toggle("open");
}

/* PERFIL */
function openProfile(){
  document.getElementById("profile").classList.toggle("open");
}

/* CARRINHO */
function openCart(){
  const panel = document.getElementById("cartPanel");
  const overlay = document.querySelector(".cartOverlay");

  panel.classList.toggle("open");
  overlay.classList.toggle("active");

  renderCart();
}

function add(produto){

  carrinho.push(produto);

  document.getElementById("count").innerText = carrinho.length;

  renderCart();
}

function renderCart(){

  let box = document.getElementById("cartItems");
  box.innerHTML = "";

  carrinho.forEach((item)=>{
    box.innerHTML += `<div class="cartItem">${item}</div>`;
  });

  document.getElementById("total").innerText = carrinho.length;
}

/* AFILIADO */
function afiliado(){
  if(isAdmin){
    alert("Afiliado liberado");
  } else {
    alert("🔒 Bloqueado");
  }
}

/* LOGOUT */
function logout(){
  location.reload();
}

</script>

  
</body>
  </html>
