<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:2px solid red;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:22px;
}

.cartBtn{
  background:#111;
  border:1px solid red;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  color:white;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.card img{
  height:70px;
}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* CARRINHO */
#cartBox{
  display:none;
  position:fixed;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  width:320px;
  border-radius:12px;
  border:1px solid red;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
}

.remove{
  color:red;
  cursor:pointer;
}

/* LOGIN */
#authBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

.authCard button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LOGIN LKSTORE</h2>

    <input id="user">
    <input id="pass" type="password">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>

    <p id="msg"></p>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE</div>

  <div class="cartBtn" onclick="toggleCart()">
    🛒 <span id="count">0</span>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products" id="products"></div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <button onclick="finalizar()" style="width:100%;padding:10px;background:red;color:white;border:none;border-radius:8px;">
    Finalizar Compra
  </button>
</div>

<script>
let carrinho = [];
let logado = false;

/* PRODUTOS */
const produtos = [
  {nome:"Netflix", img:"https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"},
  {nome:"Disney+", img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg"},
  {nome:"Prime Video", img:"https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png"},
  {nome:"Spotify", img:"https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg"}
];

/* render produtos */
function loadProducts(){
  let box = document.getElementById("products");

  produtos.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.nome}</h3>
        <button onclick="add('${p.nome}')">Comprar</button>
      </div>
    `;
  });
}
loadProducts();

/* login */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  msg.innerText = "Conta criada!";
}

function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    logado = true;
    authBox.style.display = "none";
  } else {
    msg.innerText = "Erro no login";
  }
}

/* abrir login automático */
window.onload = ()=>{
  authBox.style.display = "flex";
};

/* add carrinho */
function add(nome){
  if(!logado){
    authBox.style.display = "flex";
    alert("Faça login primeiro");
    return;
  }

  carrinho.push(nome);
  count.innerText = carrinho.length;
  renderCart();
}

/* carrinho */
function renderCart(){
  cartItems.innerHTML = "";

  carrinho.forEach((item,i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${item}
        <span class="remove" onclick="removeItem(${i})">X</span>
      </div>
    `;
  });
}

/* remover */
function removeItem(i){
  carrinho.splice(i,1);
  count.innerText = carrinho.length;
  renderCart();
}

/* toggle carrinho */
function toggleCart(){
  cartBox.style.display =
    cartBox.style.display === "block" ? "none" : "block";
}

/* finalizar */
function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  count.innerText = 0;
  renderCart();
}
</script>

</body>
</html>
