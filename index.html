<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  padding:15px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{color:red;font-weight:bold;font-size:22px;}

.topIcons{display:flex;gap:15px;cursor:pointer;}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
}

.card img{height:70px;}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* CARRINHO */
#cartBox{
  display:none;
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  width:320px;
  border-radius:12px;
  border:1px solid red;
}

/* LOGIN POPUP */
#authBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

/* BOTÕES */
button{
  cursor:pointer;
}

.finalizar{
  width:100%;
  padding:10px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">LKSTORE</div>
  <div onclick="toggleCart()">🛒 <span id="count">0</span></div>
</header>

<!-- PRODUTOS (VISÍVEL SEM LOGIN) -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="tryBuy('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="tryBuy('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="tryBuy('Prime Video')">Comprar</button>
  </div>

</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>
  <button class="finalizar" onclick="finalizar()">Finalizar Compra</button>
</div>

<!-- LOGIN / CRIAR CONTA -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">Criar Conta</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="register()">Criar conta</button>
    <button onclick="login()">Entrar</button>

    <p id="msg"></p>
  </div>
</div>

<script>

let carrinho = [];
let logado = false;
let produtoTemp = "";

/* TENTAR COMPRAR */
function tryBuy(prod){
  if(!logado){
    produtoTemp = prod;
    authBox.style.display = "flex";
    return;
  }

  add(prod);
}

/* CRIAR CONTA */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  alert("Conta criada!");
}

/* LOGIN */
function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    logado = true;
    authBox.style.display = "none";

    if(produtoTemp){
      add(produtoTemp);
      produtoTemp = "";
    }

  } else {
    msg.innerText = "Login inválido";
  }
}

/* ADD CARRINHO */
function add(prod){
  carrinho.push(prod);
  atualizar();
}

/* CARRINHO */
function toggleCart(){
  cartBox.style.display =
    cartBox.style.display === "block" ? "none" : "block";
}

/* ATUALIZAR */
function atualizar(){
  count.innerText = carrinho.length;
  cartItems.innerHTML = "";

  carrinho.forEach((item,i)=>{
    cartItems.innerHTML += `
      <div>
        ${item}
      </div>
    `;
  });
}

/* FINALIZAR */
function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  atualizar();
}

</script>

</body>
</html>
