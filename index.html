<script>

const ADMIN_EMAIL = "ls4619058@gmail.com";

let isAdmin = false;
let userLogado = "";
let carrinho = [];

/* ================= LOGIN ================= */

function register(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(!u || !p){
    alert("Preencha tudo");
    return;
  }

  localStorage.setItem("u_" + u, p);
  alert("Conta criada!");
}

function loginUser(){

  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  if(u.length === 0 || p.length === 0){
    alert("Preencha tudo");
    return;
  }

  let senhaSalva = localStorage.getItem("u_" + u);

  if(!senhaSalva){
    alert("Conta não existe");
    return;
  }

  if(senhaSalva !== p){
    alert("Senha incorreta");
    return;
  }

  userLogado = u;
  localStorage.setItem("logado", u);

  document.getElementById("userLogin").style.display = "none";

  isAdmin = (u === ADMIN_EMAIL);

  document.getElementById("adminBtn").style.display =
    isAdmin ? "block" : "none";

  carregarAnuncio();
}

/* AUTO LOGIN */
document.addEventListener("DOMContentLoaded", function(){

  let logado = localStorage.getItem("logado");

  if(logado){

    userLogado = logado;
    document.getElementById("userLogin").style.display = "none";

    isAdmin = (logado === ADMIN_EMAIL);

    document.getElementById("adminBtn").style.display =
      isAdmin ? "block" : "none";

    carregarAnuncio();
  }
});

</script>
