<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{color:red;font-weight:bold;font-size:20px;}

.searchBar{
  flex:1;
  margin:0 10px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#111;
  color:white;
}

.topIcons{display:flex;gap:8px;align-items:center;}

.profileBtn,.cartBtn{
  cursor:pointer;
}

.profileBtn{
  font-size:22px;
  padding:6px 10px;
}

.cartBtn{
  background:red;
  color:white;
  padding:8px 12px;
  border-radius:50px;
  display:flex;
  gap:6px;
  font-weight:bold;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:2999;
}

/* CARRINHO */
#cartBox{
  position:fixed;
  top:0;
  right:-350px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:3000;
  padding:15px;
}

#cartBox.open{right:0;}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  border-bottom:1px solid #222;
}

.remove{color:red;cursor:pointer;}

.finalizar, .limpar{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

.finalizar{background:red;}
.limpar{background:#333;}

/* PERFIL */
.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:4000;
  padding:15px;
}

.sidePanel.open{right:0;}

.closeX{
  cursor:pointer;
  font-size:22px;
}

/* AFILIADO BLOQUEADO */
.afiliadoBloqueado{
  color:#888;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LOGIN</h2>
    <input id="user">
    <input id="pass" type="password">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<div id="overlay" onclick="toggleCart()"></div>

<header>
  <div class="logo">LKSTORE</div>

  <input class="searchBar" placeholder="Buscar...">

  <div class="topIcons">
    <div class="profileBtn" onclick="togglePerfil()">👤</div>
    <div class="cartBtn" onclick="toggleCart()">🛒 <span id="count">0</span></div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products"></div>

<!-- CARRINHO -->
<div id="cartBox">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>🛒 Carrinho</h3>
    <span class="closeX" onclick="toggleCart()">✖</span>
  </div>

  <div id="cartItems"></div>

  <button class="finalizar" onclick="finalizar()">Finalizar</button>
  <button class="limpar" onclick="limparCarrinho()">Limpar</button>
</div>

<!-- PERFIL -->
<div id="profileBox" class="sidePanel">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>👤 Perfil</h3>
    <span class="closeX" onclick="togglePerfil()">✖</span>
  </div>

  <p>Usuário: <b id="userName">---</b></p>

  <h4>Conta</h4>
  <p>🧾 Minha conta</p>

  <h4>Afiliado</h4>
  <div id="afiliadoArea" class="afiliadoBloqueado">
    🔒 Afiliado bloqueado pelo admin
  </div>

</div>

<script>

let carrinho = [];
let userLogado = "";

/* LOGIN */
function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    authBox.style.display="none";
    userLogado = user.value;
    userName.innerText = userLogado;

    // LIBERA AFILIADO (ADMIN SIMULAÇÃO)
    if(userLogado === "admin"){
      document.getElementById("afiliadoArea").innerHTML =
        "🔗 lkstore.com/?ref=" + userLogado;
    }

    renderProdutos();
  } else alert("Erro login");
}

/* PRODUTOS */
function renderProdutos(){
  document.querySelector(".products").innerHTML = `
    <div class="card">
      <h3>Netflix</h3>
      <button onclick="add()">Comprar</button>
    </div>
  `;
}

/* CARRINHO */
function add(){
  carrinho.push("Produto");
  count.innerText = carrinho.length;
  renderCart();
}

function toggleCart(){
  cartBox.classList.toggle("open");
  overlay.style.display = cartBox.classList.contains("open") ? "block" : "none";
}

function renderCart(){
  cartItems.innerHTML="";
  carrinho.forEach((c,i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${c}
        <span class="remove" onclick="removeItem(${i})">x</span>
      </div>`;
  });
}

function removeItem(i){
  carrinho.splice(i,1);
  count.innerText = carrinho.length;
  renderCart();
}

function limparCarrinho(){
  carrinho = [];
  count.innerText = 0;
  renderCart();
}

function finalizar(){
  alert("Finalizado!");
  limparCarrinho();
  toggleCart();
}

/* PERFIL */
function togglePerfil(){
  profileBox.classList.toggle("open");
}

</script>

</body>
</html>
