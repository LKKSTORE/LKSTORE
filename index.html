<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{color:red;font-weight:bold;}

.searchBar{
  flex:1;
  margin:0 10px;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
}

.topIcons{display:flex;gap:10px;align-items:center;}

.topIcons div{cursor:pointer;font-size:20px;}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:8px;
  margin-top:8px;
  border-radius:6px;
  border:none;
}

/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:2000;
}

/* SIDE PANELS */
.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:3000;
}

.sidePanel.open{right:0;}

.closeX{float:right;cursor:pointer;}

/* BOTÕES */
.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

/* MENU */
.menu div{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

/* BANNER */
.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}

/* ADMIN */
#adminPanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:5000;
  border-left:2px solid red;
}

#adminPanel.open{right:0;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="login()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<div id="overlay" onclick="closeAll()"></div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE</div>

  <input class="searchBar" placeholder="Buscar...">

  <div class="topIcons">
    <div onclick="toggleProfile()">👤</div>
    <div onclick="toggleCart()">🛒 <span id="count">0</span></div>
    <div onclick="openAdmin()">⚙️</div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">
  <div class="card">
    <h4>Netflix</h4>
    <button class="btn red" onclick="add()">Comprar</button>
  </div>
</div>

<!-- CARRINHO -->
<div id="cartBox" class="sidePanel">
  <h3>🛒 Carrinho <span class="closeX" onclick="toggleCart()">✖</span></h3>
  <div id="cartItems"></div>

  <button class="btn red" onclick="finalizar()">Finalizar</button>
  <button class="btn gray" onclick="limpar()">Limpar</button>
</div>

<!-- PERFIL -->
<div id="profileBox" class="sidePanel">
  <h3>👤 Perfil <span class="closeX" onclick="toggleProfile()">✖</span></h3>

  <p>Usuário: <b id="userName">---</b></p>

  <div class="menu">
    <div>🧾 Minha conta</div>
    <div>🛒 Minhas compras</div>
    <div onclick="afiliado()">🤝 Afiliado</div>
    <div onclick="logout()" style="color:red;">🚪 Sair</div>
  </div>

  <p id="donoInfo" style="display:none;color:gray;margin-top:10px;">
    Dono: ls4619058@gmail.com
  </p>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="sidePanel">
  <h3>⚙️ ADMIN <span class="closeX" onclick="openAdmin()">✖</span></h3>

  <input id="adminPass" type="password" placeholder="Senha admin">
  <button class="btn red" onclick="checkAdmin()">Entrar</button>

  <div id="adminBox" style="display:none;margin-top:10px;">
    <p>✔ Admin liberado</p>
    <p>🔓 Afiliado liberado</p>
  </div>
</div>

<!-- AVISOS -->
<div class="banner">🔒 Seguro</div>
<div class="banner">⚡ Entrega automática</div>
<div class="banner">💬 Suporte 24h</div>

<script>

let carrinho = [];
let userLogado = "";
let isAdmin = false;

const ADMIN_PASS = "1234";
const DONO = "ls4619058@gmail.com";

/* LOGIN */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  alert("Conta criada!");
}

function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    userLogado = user.value;
    authBox.style.display = "none";
    userName.innerText = userLogado;

    if(userLogado === DONO){
      donoInfo.style.display = "block";
    }

  } else alert("Erro login");
}

/* CARRINHO */
function add(){
  carrinho.push("produto");
  count.innerText = carrinho.length;
}

function toggleCart(){
  cartBox.classList.toggle("open");
  overlay.style.display = cartBox.classList.contains("open") ? "block" : "none";
}

function toggleProfile(){
  profileBox.classList.toggle("open");
  overlay.style.display = profileBox.classList.contains("open") ? "block" : "none";
}

function limpar(){
  carrinho = [];
  count.innerText = 0;
}

function finalizar(){
  alert("Compra finalizada!");
  limpar();
}

/* ADMIN */
function openAdmin(){
  adminPanel.classList.toggle("open");
}

function checkAdmin(){
  let pass = document.getElementById("adminPass").value;

  if(pass === ADMIN_PASS){
    isAdmin = true;
    document.getElementById("adminBox").style.display = "block";
    document.getElementById("afiliado").innerHTML = "✅ Afiliado liberado";
    alert("Admin liberado!");
  } else {
    alert("Senha errada!");
  }
}

/* AFILIADO */
function afiliado(){
  if(isAdmin){
    alert("Você já tem acesso afiliado!");
  } else {
    alert("🔒 Bloqueado - precisa admin");
  }
}

function logout(){
  location.reload();
}

function closeAll(){
  cartBox.classList.remove("open");
  profileBox.classList.remove("open");
  adminPanel.classList.remove("open");
  overlay.style.display = "none";
}

</script>

</body>
</html>
