<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:2px solid red;
  z-index:1000;
  gap:10px;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:20px;
}

.searchBar{
  flex:1;
  margin:0 10px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#111;
  color:white;
}

.topIcons{
  display:flex;
  align-items:center;
  gap:8px;
}

.profileBtn{
  font-size:22px;
  cursor:pointer;
  padding:6px 10px;
}

.cartBtn{
  background:red;
  color:white;
  padding:8px 12px;
  border-radius:50px;
  cursor:pointer;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:bold;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
}

.card img{height:70px;}

.card button{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:2999;
}

/* CARRINHO */
#cartBox{
  position:fixed;
  top:0;
  right:-350px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:3000;
  padding:15px;
}

#cartBox.open{right:0;}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  border-bottom:1px solid #222;
  padding-bottom:5px;
}

.remove{color:red;cursor:pointer;}

.finalizar{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* PERFIL + ADMIN */
.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:4000;
  padding:15px;
}

.sidePanel.open{right:0;}

.sideBox{
  background:#000;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid #222;
}

#adminBox input{
  width:100%;
  padding:8px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#000;
  color:white;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LKSTORE LOGIN</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
  </div>
</div>

<div id="overlay" onclick="toggleCart()"></div>

<!-- HEADER -->
<header>

  <div class="logo">LKSTORE</div>

  <input class="searchBar" placeholder="Buscar produtos...">

  <div class="topIcons">

    <div class="profileBtn" onclick="togglePerfil()">👤</div>
    <div class="profileBtn" onclick="toggleAdmin()">⚙️</div>

    <div class="cartBtn" onclick="toggleCart()">
      🛒 <span id="count">0</span>
    </div>

  </div>
</header>

<!-- PRODUTOS -->
<div class="products"></div>

<!-- CARRINHO -->
<div id="cartBox">

  <div style="display:flex;justify-content:space-between;">
    <h3>🛒 Carrinho</h3>
    <span onclick="toggleCart()" style="cursor:pointer;">✖</span>
  </div>

  <div id="cartItems"></div>

  <button class="finalizar" onclick="finalizar()">Finalizar</button>

  <!-- 🔥 BOTÃO NOVO -->
  <button onclick="limparCarrinho()" style="
    width:100%;
    margin-top:8px;
    padding:10px;
    background:#333;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
  ">
    🧹 Limpar Carrinho
  </button>

</div>

<!-- PERFIL -->
<div id="profileBox" class="sidePanel">

  <div style="display:flex;justify-content:space-between;">
    <h3>👤 Perfil</h3>
    <span onclick="togglePerfil()" style="cursor:pointer;">✖</span>
  </div>

  <div class="sideBox">
    <h4>🧾 Minha conta</h4>
    <p>👤 Usuário: <span id="userName">---</span></p>
  </div>

</div>

<!-- ADMIN -->
<div id="adminBox" class="sidePanel">

  <div style="display:flex;justify-content:space-between;">
    <h3>⚙️ ADMIN</h3>
    <span onclick="toggleAdmin()" style="cursor:pointer;">✖</span>
  </div>

  <input id="prodName" placeholder="Nome produto">
  <input id="prodImg" placeholder="Imagem URL">

  <button class="finalizar" onclick="addProduct()">Adicionar</button>

</div>

<script>

let carrinho = [];
let logado = false;

let produtos = [
  {nome:"Netflix",img:"https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"},
  {nome:"Disney+",img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg"}
];

/* LOGIN */
function register(){
  let u = user.value;
  let p = pass.value;
  localStorage.setItem("user_"+u,p);
  alert("Conta criada!");
}

function login(){
  let u = user.value;
  let p = pass.value;

  if(localStorage.getItem("user_"+u) === p){
    logado = true;
    localStorage.setItem("logadoUser",u);
    authBox.style.display="none";
    loadUser();
    renderProdutos();
  } else alert("Erro login");
}

function loadUser(){
  userName.innerText = localStorage.getItem("logadoUser") || "---";
}

/* PRODUTOS */
function renderProdutos(){
  let box = document.querySelector(".products");
  box.innerHTML = "";

  produtos.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.nome}</h3>
        <button onclick="add('${p.nome}')">Comprar</button>
      </div>
    `;
  });
}

/* CARRINHO */
function add(prod){
  if(!logado) return alert("Login primeiro");

  carrinho.push(prod);
  count.innerText = carrinho.length;
  renderCart();
}

function toggleCart(){
  cartBox.classList.toggle("open");
  overlay.style.display = cartBox.classList.contains("open")?"block":"none";
}

function renderCart(){
  cartItems.innerHTML="";
  carrinho.forEach((c,i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${c}
        <span onclick="removeItem(${i})" class="remove">x</span>
      </div>`;
  });
}

function removeItem(i){
  carrinho.splice(i,1);
  count.innerText=carrinho.length;
  renderCart();
}

function finalizar(){
  alert("Finalizado!");
  carrinho=[];
  count.innerText=0;
  renderCart();
  toggleCart();
}

/* 🧹 LIMPAR CARRINHO */
function limparCarrinho(){
  if(carrinho.length === 0){
    alert("Carrinho já está vazio");
    return;
  }

  if(confirm("Deseja limpar o carrinho?")){
    carrinho = [];
    count.innerText = 0;
    renderCart();
  }
}

/* PERFIL */
function togglePerfil(){
  profileBox.classList.toggle("open");
}

/* ADMIN */
function toggleAdmin(){
  adminBox.classList.toggle("open");
}

</script>

</body>
</html>
