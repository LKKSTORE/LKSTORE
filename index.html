<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{


  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

 <div class="topIcons">
  <div onclick="openPerfil()">👤</div>
  <div onclick="openCart()">🛒 <span id="count">0</span></div>
</div>  
</header>

<div id="avisoLoja" class="banner">
🔥 Bem-vindo à LKSTORE
</div>

<!-- PRODUTOS -->
<div class="products"></div>

<!-- MODAL PRODUTO -->
<div id="modalAddProduto" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
">

  <div style="background:#fff; padding:20px; border-radius:10px; width:300px;">
    <h3>Adicionar Produto</h3>

    <input type="text" id="nomeProduto" placeholder="Nome"><br><br>
    <input type="text" id="precoProduto" placeholder="Preço"><br><br>
    <input type="text" id="imgProduto" placeholder="Imagem URL"><br><br>

    <button onclick="adicionarProduto()">Salvar</button>
    <button onclick="fecharAddProduto()">Fechar</button>
  </div>

</div>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let isAdmin = false;
let userLogado = "";
let carrinho = [];

const ADMIN_EMAIL = "ls4619058@gmail.com";

/* LOGIN */
function register(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(!u || !p){
    alert("Preencha usuário e senha");
    return;
  }

  localStorage.setItem("u_" + u, p);
  alert("Conta criada!");
}

function loginUser(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("u_" + u) === p){

    userLogado = u;
    isAdmin = (u === ADMIN_EMAIL);

    document.getElementById("userLogin").style.display = "none";

    renderizar();

    alert("Login realizado!");

  }else{
    alert("Login inválido");
  }
}

function logout(){

  userLogado = "";
  isAdmin = false;

  document.getElementById("userLogin").style.display = "flex";

  closePerfil();
  renderizar();
}

/* PERFIL */

function openPerfil(){

  document.getElementById("perfilModal").style.display = "block";

  document.getElementById("perfilUser").innerText =
  "Usuário: " + userLogado;

  document.getElementById("admTabBtn").style.display =
  isAdmin ? "inline-block" : "none";
}

function closePerfil(){
  document.getElementById("perfilModal").style.display = "none";
}

function showTab(tab){

  document.getElementById("tabPerfil").style.display = "none";
  document.getElementById("tabAdm").style.display = "none";

  if(tab === "perfil"){
    document.getElementById("tabPerfil").style.display = "block";
  }

  if(tab === "adm"){
    document.getElementById("tabAdm").style.display = "block";
  }
}

/* PRODUTOS */

function salvar(){
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

function renderizar(){

  const container = document.querySelector(".products");

  container.innerHTML = "";

  produtos.forEach(p => {

    container.innerHTML += `
      <div class="card">

        ${p.img ? `<img src="${p.img}" width="100%">` : ""}

        <h4>${p.nome}</h4>

        <p>R$ ${p.preco}</p>

        <p>
          ${p.esgotado ? "🚫 ESGOTADO" : "✅ DISPONÍVEL"}
        </p>

        ${
          isAdmin ? `
            <button onclick="editarProdutoPrompt(${p.id})">
              ✏️ Editar
            </button>

            <button onclick="alternarEsgotado(${p.id})">
              ${p.esgotado ? "✅ Disponível" : "🚫 Esgotar"}
            </button>

            <button onclick="liberarAfiliado(${p.id})">
              ${p.afiliadoLiberado ? "🤝 Afiliado ON" : "🤝 Afiliado OFF"}
            </button>

            <button onclick="removerProduto(${p.id})">
              🗑️ Remover
            </button>
          `
          : ""
        }

      </div>
    `;
  });
}

function adicionarProduto(){

  let nome = document.getElementById("nomeProduto").value;
  let preco = document.getElementById("precoProduto").value;
  let img = document.getElementById("imgProduto").value;

  if(!nome || !preco){
    alert("Preencha nome e preço");
    return;
  }

  produtos.push({
    id: Date.now(),
    nome,
    preco,
    img,
    afiliadoLiberado:false,
    esgotado:false
  });

  salvar();
  renderizar();
  fecharAddProduto();

  document.getElementById("nomeProduto").value = "";
  document.getElementById("precoProduto").value = "";
  document.getElementById("imgProduto").value = "";
}

function editarProdutoPrompt(id){

  let produto = produtos.find(p => p.id === id);

  if(!produto) return;

  let nome = prompt("Novo nome:", produto.nome);
  if(nome === null) return;

  let preco = prompt("Novo preço:", produto.preco);
  if(preco === null) return;

  produtos = produtos.map(p => {

    if(p.id === id){
      return {
        ...p,
        nome: nome,
        preco: preco
      };
    }

    return p;
  });

  salvar();
  renderizar();

  alert("Produto atualizado!");
}

  salvar();
  renderizar();
}

function alternarEsgotado(id){

  produtos = produtos.map(p => {

    if(p.id === id){
      p.esgotado = !p.esgotado;
    }

    return p;
  });

  salvar();
  renderizar();
}

function liberarAfiliado(id){

  produtos = produtos.map(p => {

    if(p.id === id){
      p.afiliadoLiberado = !p.afiliadoLiberado;
    }

    return p;
  });

  salvar();
  renderizar();
}

function removerProduto(id){

  if(!confirm("Remover produto?")) return;

  produtos = produtos.filter(p => p.id !== id);

  salvar();
  renderizar();
}

function mudarAnuncio(){

  let txt = prompt("Novo anúncio:");

  if(txt){
    document.getElementById("avisoLoja").innerText = txt;
  }
}

/* CARRINHO */

function add(nome){
  carrinho.push(nome);
  document.getElementById("count").innerText = carrinho.length;
}

function openCart(){
  alert("Carrinho: " + carrinho.join(", "));
}

/* MODAL */

function abrirAddProduto(){
  document.getElementById("modalAddProduto").style.display = "flex";
}

function fecharAddProduto(){
  document.getElementById("modalAddProduto").style.display = "none";
}

renderizar();

</script>
<div id="perfilModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
z-index:99999;
padding:20px;
color:white;
">

  <div style="background:#111;padding:20px;border-radius:10px;max-width:400px;margin:auto;">

   <h2>👤 Perfil</h2>

<p id="perfilUser"></p>

<hr>

<div style="display:flex;gap:10px;">
  <button onclick="showTab('perfil')">👤 Perfil</button>
  <button id="admTabBtn" onclick="showTab('adm')" style="display:none;">⚙️ ADM</button>
</div>

<br>

<div id="tabPerfil">
  <p>Bem-vindo ao seu perfil.</p>
  <button onclick="logout()">🚪 Sair</button>
</div>

<div id="tabAdm" style="display:none;">
  <h3>⚙️ Painel ADM</h3>

  <button onclick="mudarAnuncio()">📢 Mudar Anúncio</button>
  <button onclick="abrirAddProduto()">➕ Adicionar Produto</button>
  <button onclick="alert('Remover produto')">🗑️ Remover Produto</button>
  <button onclick="alert('Afiliados')">🤝 Afiliados</button>
</div>

<br><br>
<button onclick="closePerfil()">❌ Fechar</button>
</div>
  </body>
</html>
