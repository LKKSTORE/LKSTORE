<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:radial-gradient(circle at top,#1a0000,#000);color:white;}

header{
display:flex;justify-content:space-between;
padding:18px 40px;background:rgba(0,0,0,0.7);
position:sticky;top:0;
}

.logo{color:red;font-size:26px;font-weight:900;}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
}

#cartBox{
position:fixed;
right:20px;
top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:220px;
}
</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<section class="products">

<div class="card">
<h3>Premium 1</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 1', 29)">Comprar</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 2', 49)">Comprar</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<p>Streaming</p>
<button onclick="addToCart('Premium 3', 99)">Comprar</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">
<h3 style="color:red;">Carrinho</h3>
<div id="cartItems"></div>
<p>Total: R$ <span id="total">0</span></p>
</div>

<script>

let cart = [];
let total = 0;

// adicionar produto
function addToCart(name, price){
cart.push({name,price});
updateCart();
}

// atualizar carrinho
function updateCart(){
let box = document.getElementById("cartItems");
box.innerHTML = "";
total = 0;

cart.forEach((item,index)=>{
total += item.price;

box.innerHTML += `
<p>
${item.name} - R$ ${item.price}
<button onclick="removeItem(${index})">X</button>
</p>
`;
});

document.getElementById("total").innerText = total;
}

// remover item
function removeItem(index){
cart.splice(index,1);
updateCart();
}

</script>

</body>
</html>
