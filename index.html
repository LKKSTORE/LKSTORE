<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
/* ===== SEU CSS ORIGINAL (INTOCADO) ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
min-height:100vh;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:1000;
}

.logo{font-size:24px;font-weight:900;color:#ff3b3b;}

.topIcons{display:flex;gap:10px;}

.icon{
width:42px;height:42px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
cursor:pointer;background:#222;position:relative;
}

.cart{background:#ff3b3b;}

#cartCount{
position:absolute;top:-5px;right:-5px;
background:white;color:black;width:18px;height:18px;
border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:bold;
}

.searchBox{text-align:center;padding:20px;}

.searchBox input{
width:90%;max-width:500px;padding:12px;
border:none;border-radius:10px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;padding:25px;
}

.card{
background:#151515;border:1px solid #222;
padding:20px;border-radius:12px;text-align:center;
}

.card button{
width:100%;padding:10px;
background:#ff3b3b;color:white;
border:none;border-radius:8px;
}

#cartBox{
position:fixed;right:-320px;top:70px;
width:300px;height:500px;
background:#111;border-left:2px solid #ff3b3b;
padding:15px;overflow:auto;transition:.4s;
}

#authBox{
display:flex;position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.95);
justify-content:center;align-items:center;
z-index:99999;
}

.authCard{
background:#111;padding:25px;border-radius:12px;
width:320px;border:1px solid #ff3b3b;
}

.authCard input{
width:100%;padding:10px;margin-bottom:10px;
border:none;border-radius:8px;
}

.authCard button{
width:100%;padding:10px;
background:#ff3b3b;color:white;
border:none;border-radius:8px;
}

#perfilBox{
position:fixed;top:0;right:-100%;
width:100%;height:100%;
background:linear-gradient(180deg,#ff1a1a,#b30000,#1a0000,#0b0b0b);
transition:.4s;
padding:25px;
}

#afiliadoBox{
display:none;
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;
border-radius:12px;border:1px solid #ff3b3b;
}

.whats{
position:fixed;bottom:20px;right:20px;
background:#25D366;padding:14px;
border-radius:50px;color:white;text-decoration:none;
}
</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>

<div class="topIcons">
<div class="icon" onclick="abrirPerfil()">👤</div>
<div class="icon cart" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>
</div>
</header>

<div class="searchBox">
<input id="search" placeholder="Buscar produtos..." onkeyup="filtrar()">
</div>

<section class="products">

<div class="card item">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',6)">Comprar R$ 6</button>
</div>

<div class="card item">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',4)">Comprar R$ 4</button>
</div>

<div class="card item">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',7)">Comprar R$ 7</button>
</div>

</section>

<!-- CART -->
<div id="cartBox">
<h3>Carrinho</h3>
<div id="cartItems"></div>
<p>Total: R$ <span id="total">0</span></p>

<button onclick="finalizarCompraDireto()">Finalizar Compra</button>
</div>

<!-- LOGIN -->
<div id="authBox">
<div class="authCard">
<h2>LKSTORE</h2>

<input id="loginUser" placeholder="Usuário">
<input id="loginPass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>
<button onclick="register()">Criar Conta</button>
</div>
</div>

<!-- PERFIL -->
<div id="perfilBox">
<h1>Meu Perfil</h1>
<h2 id="perfilNome">Usuário</h2>
<button onclick="logout()">Sair</button>
</div>

<a class="whats" href="https://wa.me/5582991585655">💬</a>

<script>
/* ===== SEU JS ORIGINAL ===== */
let cart = [];

function addToCart(name, price){
cart.push({name,price});
document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart(){
let box=document.getElementById("cartBox");
box.style.right = box.style.right==="0px"?"-320px":"0px";
}

function filtrar(){
let input=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".item").forEach(i=>{
i.style.display=i.innerText.toLowerCase().includes(input)?"block":"none";
});
}
</script>

<!-- 🔥 FIREBASE (CORRIGIDO, SEM DUPLICAÇÃO) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "SUA_API_KEY",
authDomain: "SEU_AUTH_DOMAIN",
projectId: "SEU_PROJECT_ID",
storageBucket: "SEU_STORAGE_BUCKET",
messagingSenderId: "SEU_SENDER_ID",
appId: "SEU_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== LOGIN CORRIGIDO ===== */
function register(){
let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

db.collection("users").add({
email:user,
password:pass
});

alert("Conta criada!");
}

function login(){
let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

db.collection("users")
.where("email","==",user)
.where("password","==",pass)
.get()
.then(snap=>{
if(!snap.empty){
document.getElementById("authBox").style.display="none";
document.getElementById("perfilNome").innerText=user;
alert("Login OK!");
}else{
alert("Erro no login");
}
});
}

function logout(){
location.reload();
}
</script>

</body>
</html>
