<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:3000;
}

.sidePanel.open{right:0;}

.close{float:right;cursor:pointer;}

.menu div{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

#adminPanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  border-left:2px solid red;
  z-index:5000;
}

#adminPanel.open{right:0;}

.cartPanel{
  position:fixed;
  top:0;
  right:0;
  width:320px;
  height:100%;
  background:#111;
  padding:15px;
  z-index:6000;
  transform:translateX(100%);
  transition:0.35s;
}

.cartPanel.open{transform:translateX(0);}

.cartOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
}

.cartOverlay.active{
  opacity:1;
  pointer-events:all;
}

.cartItem{
  background:#222;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
    <button class="btn gray" onclick="openAdminLogin()">⚙️ Admin</button>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="screen" style="display:none;">
  <div class="box">
    <h3>LOGIN ADMIN</h3>
    <input id="adminPass" type="password">
    <button class="btn red" onclick="loginAdmin()">Entrar</button>
    <button class="btn gray" onclick="closeAdminLogin()">Voltar</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openProfile()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
    <div id="adminBtn" onclick="openAdmin()" style="display:none;">⚙️</div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

 <div class="card">

  <h4>Netflix</h4>

  <button class="btn red" onclick="add('Netflix')">
    Comprar
  </button>

  <button onclick="editarNome(this)">
    ✏️ Editar Nome
  </button>

  <button onclick="trocarImagem(this)">
    🖼️ Trocar Imagem
  </button>

  <button onclick="esgotarProduto(this)">
    🚫 Esgotar
  </button>

  <button onclick="this.parentElement.remove()">
    🗑️ Remover
  </button>

</div>
</div>
<!-- PERFIL -->
<div id="profile" class="sidePanel">
  <span class="close" onclick="openProfile()">✖</span>
  <h3>Perfil</h3>
  <p id="userName">---</p>
</div>

<!-- ADMIN -->
<div id="adminPanel">
  <span class="close" onclick="openAdmin()">✖</span>

  <h3>Painel ADM</h3>

  <input id="nomeProd" placeholder="Nome">
  <input id="precoProd" placeholder="Preço">
  <input id="imgProd" placeholder="Imagem">

  <button class="btn red" onclick="adicionarProduto()">Adicionar</button>
</div>

<!-- CARRINHO -->
<div class="cartOverlay" onclick="openCart()"></div>

<div id="cartPanel" class="cartPanel">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>
  <p>Total: <span id="total">0</span></p>
</div>

<!-- BANNERS -->
<div class="banner">🔒 Seguro</div>
<div class="banner">⚡ Entrega automática</div>
<div class="banner">💬 Suporte 24h</div>

<!-- SCRIPT -->
<script>

function editarNome(botao){

  let novoNome = prompt("Novo nome do produto:");

  if(!novoNome) return;

  let card = botao.parentElement;

  let titulo = card.querySelector("h4");

  if(titulo){
    titulo.innerText = novoNome;
  }

}
  
  let isAdmin = false;
let userLogado = "";
let carrinho = [];

const ADMIN_PASS = "1234";

/* LOGIN USER */
function register(){
  let u = user.value;
  let p = pass.value;
  localStorage.setItem("u_"+u,p);
  alert("Conta criada!");
}

function loginUser(){
  let u = user.value;
  let p = pass.value;

function esgotarProduto(botao){

  let card = botao.parentElement;

  let btnComprar = card.querySelector(".comprarBtn");

  if(btnComprar){
    btnComprar.innerHTML = "🚫 ESGOTADO";
    btnComprar.disabled = true;
  }

}
  
  if(localStorage.getItem("u_"+u) === p){
    userLogado = u;
    userLogin.style.display="none";
    userName.innerText=u;
  } else alert("Erro login");
}

function trocarImagem(botao){

  let novaImagem = prompt("Cole a URL da nova imagem:");

  if(novaImagem){

    let card = botao.parentElement;

    let img = card.querySelector("img");

    if(img){
      img.src = novaImagem;
    }

  }

}
  
/* ADMIN */
function openAdminLogin(){
  adminLogin.style.display="flex";
}

function closeAdminLogin(){
  adminLogin.style.display="none";
}

function loginAdmin(){
  if(adminPass.value === ADMIN_PASS){
    isAdmin = true;
    adminBtn.style.display="block";
    closeAdminLogin();
    alert("ADM liberado");
  } else alert("Senha errada");
}

function openAdmin(){
  if(!isAdmin) return alert("Negado");
  adminPanel.classList.toggle("open");
}

/* PRODUTOS */
function adicionarProduto(){
  let nome = nomeProd.value;
  let preco = precoProd.value;

  products.innerHTML += `
    <div class="card">
      <span class="nome-produto">${nome}</span>
      <p class="preco-produto">R$ ${preco}</p>

      <button onclick="add('${nome}')">Comprar</button>
      <button onclick="removerProduto(this)">🗑️ Remover</button>
      <button onclick="editarProduto(this)">✏️ Editar</button>
    </div>
  `;
}

/* EDITAR */
function editarProduto(botao){
  if(!isAdmin) return alert("Só ADM");

  let card = botao.parentElement;

  let nome = card.querySelector(".nome-produto");
  let preco = card.querySelector(".preco-produto");

  let n = prompt("Nome:", nome.innerText);
  let p = prompt("Preço:", preco.innerText);

  if(n) nome.innerText=n;
  if(p) preco.innerText=p;
}

/* REMOVER */
function removerProduto(botao){
  if(!isAdmin) return alert("Só ADM");
  botao.parentElement.remove();
}

/* CARRINHO */
function add(nome){
  carrinho.push(nome);
  count.innerText = carrinho.length;
}

function openCart(){
  cartPanel.classList.toggle("open");
  cartOverlay.classList.toggle("active");
}

function openProfile(){
  profile.classList.toggle("open");
}

</script>

</body>
</html>
