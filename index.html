<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-between;
  padding:15px;
  z-index:1000;
}

.logo{color:#00ff88;font-weight:bold;font-size:20px}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  background:#111;
  width:230px;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.card img{
  height:70px;
  margin-bottom:10px;
}

.card button{
  width:100%;
  padding:10px;
  background:#00ff88;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* BANNER */
.banner{
  background:#111;
  margin:10px;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.grande{font-size:22px;font-weight:bold}
.medio{font-size:18px}
.pequeno{font-size:14px;opacity:0.8}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
}

.authCard input{
  width:100%;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
}

/* CARRINHO */
#cart{
  position:fixed;
  right:10px;
  top:80px;
  background:#111;
  padding:10px;
  width:250px;
  border-radius:10px;
}

.item{
  font-size:14px;
  margin:5px 0;
}

.total{
  margin-top:10px;
  font-weight:bold;
  color:#00ff88;
}

button.finalizar{
  margin-top:10px;
  width:100%;
  background:#00ff88;
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2>LOGIN</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
    <p id="msg"></p>
  </div>
</div>

<header>
  <div class="logo">LKSTORE</div>
  <div>🛒 <span id="count">0</span></div>
</header>

<!-- CARRINHO -->
<div id="cart">
  <h3>Carrinho</h3>
  <div id="items"></div>
  <div class="total">Total: R$ <span id="total">0</span></div>
  <button class="finalizar">Finalizar compra</button>
</div>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix', 19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+', 15.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video', 14.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Paramount%2B_logo.svg">
    <h3>Premiere</h3>
    <button onclick="add('Premiere', 19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify', 9.90)">Comprar</button>
  </div>

</div>

<!-- BANNERS -->
<div class="banner grande">🔒 PAGAMENTO 100% SEGURO</div>
<div class="banner medio">⚡ ENTREGA IMEDIATA</div>
<div class="banner pequeno">💬 SUPORTE VIA WHATSAPP</div>

<script>
let carrinho = [];
let total = 0;

/* LOGIN */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  alert("Conta criada!");
}

function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    authBox.style.display = "none";
  } else {
    msg.innerText = "Login inválido";
  }
}

/* CARRINHO */
function add(nome, preco){

  carrinho.push(nome);
  total += preco;

  count.innerText = carrinho.length;

  items.innerHTML += `<div class="item">${nome} - R$ ${preco}</div>`;
  document.getElementById("total").innerText = total.toFixed(2);
}
</script>

</body>
</html>
