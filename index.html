  .cartBtn{

  display:flex;

  position:relative;

}
/* ÍCONES PERFIL */
.profileBtn{
  font-size:22px;

  padding:6px 8px;
}

/* CARRINHO */
.cartBtn{
  background:red;
  color:white;
  padding:8px 10px;
  border-radius:50px;
  cursor:pointer;
  display:flex;
  gap:6px;

  font-weight:bold;
}
  
/* HEADER */
header{

  width:100%;
  background:#000;
  display:flex;

  justify-content:space-between;

  z-index:1000;

}

/* LOGO */
.logo{

}

/* SEARCH NO MEIO */
.searchBar{
  flex:1;
  margin:0 10px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;

  color:white;
}

 .topIcons{
  display:flex;
  align-items:center;
  gap:6px;
  margin-right:8px;
}

/* PERFIL */
.profileBtn{
  font-size:22px;

  padding:6px 10px;
}

/* CARRINHO */
.cartBtn{
  background:red;
  color:white;
  padding:8px 12px;
  border-radius:50px;
  cursor:pointer;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:bold;
}
  
.banner{
  background:#111;
  margin:10px auto;
  padding:15px;
  border-left:4px solid red;
  border-radius:10px;
  max-width:700px;
}

.grande{font-size:20px;font-weight:bold;}
.medio{font-size:16px;}
.pequeno{font-size:14px;opacity:0.8;}

  
/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:999;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:22px;
}

.topIcons{
  display:flex;
  align-items:center;
}

.cartBtn{
  background:red;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  display:flex;
  gap:6px;
  align-items:center;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;

}

.card img{

}

.card button{

  padding:10px;
  background:red;

  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* CARRINHO LATERAL */
#cartBox{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#111;
  z-index:1000;
  padding:15px;
  transition:0.3s;
  box-shadow:-5px 0 20px rgba(0,0,0,0.5);
}

#cartBox.open{
  right:0;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  border-bottom:1px solid #222;
  padding-bottom:5px;
}

.remove{
  color:red;
  cursor:pointer;
}

.finalizar{

  padding:10px;
  margin-top:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3000;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
}
@media (max-width: 600px){

  header{
    padding:10px;
  }

  .logo{
    font-size:16px;
  }

  .searchBar{
    display:none; /* opcional: evita apertar no celular */
  }

  .topIcons{
    gap:4px;
  }

  .profileBtn{
    font-size:20px;
    padding:4px;
  }

  .cartBtn{
    padding:6px 8px;
    font-size:14px;
    right:0;
  }
}
  
</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" onclick="toggleCart()"></div>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LKSTORE LOGIN</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <!-- LOGO -->
  <div class="logo">LKSTORE</div>

  <!-- SEARCH (MEIO) -->
  <input class="searchBar" placeholder="Buscar produtos...">

  <!-- ÍCONES DIREITA -->
  <div class="topIcons">

    <!-- PERFIL -->
    <div class="profileBtn" onclick="abrirPerfil()">
      👤
    </div>

    <!-- CARRINHO -->
    <div class="cartBtn" onclick="toggleCart()">
      🛒 <span id="count">0</span>
    </div>

  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify')">Comprar</button>
  </div>

</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <button class="finalizar" onclick="finalizar()">Finalizar Compra</button>
</div>

<script>

let carrinho = [];
let logado = false;

/* LOGIN */
function register(){
  let u = user.value;
  let p = pass.value;
  localStorage.setItem("user_"+u,p);
  alert("Conta criada!");
}

function login(){
  let u = user.value;
  let p = pass.value;

  if(localStorage.getItem("user_"+u) === p){
    logado = true;
    authBox.style.display = "none";
  } else {
    alert("Login inválido");
  }
}

/* ADD */
function add(prod){
  if(!logado){
    alert("Crie uma conta e faça login!");
    return;
  }

  carrinho.push(prod);
  count.innerText = carrinho.length;
  renderCart();
}

/* TOGGLE CART */
function toggleCart(){
  const cart = document.getElementById("cartBox");
  const overlay = document.getElementById("overlay");

  cart.classList.toggle("open");

  overlay.style.display = cart.classList.contains("open") ? "block" : "none";

  renderCart();
}

/* RENDER */
function renderCart(){
  cartItems.innerHTML = "";

  carrinho.forEach((item, i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${item}
        <span class="remove" onclick="removeItem(${i})">x</span>
      </div>
    `;
  });
}

/* REMOVE */
function removeItem(i){
  carrinho.splice(i,1);
  count.innerText = carrinho.length;
  renderCart();
}

/* FINALIZAR */
function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  count.innerText = 0;
  renderCart();
  toggleCart();
}

</script>

<!-- AVISOS -->
<div style="margin-top:40px; text-align:center; padding:20px;">

  <div class="banner grande">🔒 PAGAMENTO 100% SEGURO</div>

  <div class="banner medio">⚡ ENTREGA AUTOMÁTICA APÓS PAGAMENTO</div>

  <div class="banner pequeno">💬 SUPORTE VIA WHATSAPP 24H</div>

</div>

<div id="profileBox" class="profileBox">

  <div class="profileHeader">
    <h3>👤 Meu Perfil</h3>
    <span onclick="fecharPerfil()" style="cursor:pointer;">❌</span>
  </div>

  <div class="tabs">
    <button onclick="openTab('conta')">Conta</button>
    <button onclick="openTab('pedidos')">Pedidos</button>
    <button onclick="openTab('config')">Config</button>
  </div>

  <div id="conta" class="tab active">
    <p>📧 Usuário logado</p>
  </div>

  <div id="pedidos" class="tab">
    <p>🛒 Nenhum pedido ainda</p>
  </div>

  <div id="config" class="tab">
    <p>⚙️ Configurações da conta</p>
  </div>

  <button class="logout" onclick="logout()">Sair</button>

</div>
  
</body>
</html>
