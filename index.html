<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:linear-gradient(120deg,#2b0000,#000);
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:18px;
background:#111;
position:sticky;
top:0;
}

.logo{color:red;font-size:26px;font-weight:900;}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
}

#cartBox{
position:fixed;
right:20px;
top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:240px;
}

#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:10px;
width:320px;
z-index:9999;
}

/* LOGIN MODAL */
#authBox{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

button{cursor:pointer;}

</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>
</header>

<!-- PRODUTOS -->
<section class="products">

<div class="card">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',1)">Comprar</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',1)">Comprar</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',1)">Comprar</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">

<h3 style="color:red;">Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;">
Checkout
</button>

<button onclick="gerarPagamento()" style="width:100%;padding:10px;background:green;color:white;">
Pagar PagSeguro
</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<button onclick="fecharCheckout()" style="padding:10px;background:red;color:white;">
Fechar
</button>

</div>

<!-- LOGIN -->
<div id="authBox">

<h2 style="color:red;">LOGIN</h2>

<input id="loginUser" placeholder="Usuário" style="padding:10px;margin:5px;">
<input id="loginPass" type="password" placeholder="Senha" style="padding:10px;margin:5px;">

<button onclick="login()" style="padding:10px;background:red;color:white;width:100%;">
Entrar
</button>

</div>

<!-- SUPORTE -->
<a href="https://wa.me/5582991585655"
style="position:fixed;bottom:20px;right:20px;background:#25D366;padding:14px;border-radius:50px;color:white;text-decoration:none;">
💬 Suporte
</a>

<script>

let cart=[];

/* LOGIN SIMPLES */
function login(){
let u=document.getElementById("loginUser").value;
let p=document.getElementById("loginPass").value;

if(u && p){
localStorage.setItem("logado","1");
document.getElementById("authBox").style.display="none";
alert("Login OK");
}
}

/* CARRINHO */
function addToCart(n,p){
cart.push({n,p});
update();
}

function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
t+=i.p;
box.innerHTML+=<p>${i.n} - R$ ${i.p}</p>;
});

document.getElementById("total").innerText=t;
}

/* CHECKOUT */
function abrirCheckout(){
document.getElementById("checkoutBox").style.display="block";

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
box.innerHTML+=<p>${i.n} - R$ ${i.p}</p>;
t+=i.p;
});

document.getElementById("checkoutTotal").innerText=t;
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

/* PAGSEGURO LINK */
function gerarPagamento(){

if(cart.length===0){
alert("Carrinho vazio");
return;
}

let baseLink="https://pag.ae/81R2Yyh2N";

window.open(baseLink,"_blank");
}

</script>

</body>
</html>
