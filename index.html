<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openPerfil()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
  </div>
</header>

<div id="avisoLoja" class="banner">🔥 Bem-vindo à LKSTORE</div>
