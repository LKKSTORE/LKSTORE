<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
:root{
  --vermelho:#e50914;
  --preto:#000;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:var(--preto);
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-between;
  padding:15px;
  border-bottom:1px solid var(--vermelho);
  z-index:1000;
}

.logo{
  color:var(--vermelho);
  font-weight:bold;
  font-size:20px;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  background:#111;
  width:220px;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.05);
  border:1px solid var(--vermelho);
}

.card img{
  height:70px;
  margin-bottom:10px;
}

.card button{
  width:100%;
  padding:10px;
  background:var(--vermelho);
  border:none;
  border-radius:8px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

/* LOGIN */
#login{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid var(--vermelho);
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

/* CARRINHO */
#cart{
  position:fixed;
  right:0;
  top:80px;
  width:260px;
  height:100%;
  background:#111;
  border-left:1px solid var(--vermelho);
  padding:10px;
}

.item{
  font-size:13px;
  margin:5px 0;
}

.total{
  margin-top:10px;
  color:var(--vermelho);
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h2 style="color:#e50914">LKSTORE LOGIN</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>

    <p id="msg"></p>
  </div>
</div>

<header>
  <div class="logo">LKSTORE</div>
  <div>🛒 <span id="count">0</span></div>
</header>

<!-- CARRINHO -->
<div id="cart">
  <h3>Carrinho</h3>
  <div id="items"></div>
  <div class="total">Total: R$ <span id="total">0</span></div>
</div>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix',19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+',15.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video',14.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Paramount%2B_logo.svg">
    <h3>Premiere</h3>
    <button onclick="add('Premiere',19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify',9.90)">Comprar</button>
  </div>

</div>

<script>
let carrinho = [];
let total = 0;

/* LOGIN */
function register(){
  localStorage.setItem(user.value, pass.value);
  alert("Conta criada!");
}

function login(){
  if(localStorage.getItem(user.value) === pass.value){
    document.getElementById("login").style.display = "none";
  } else {
    msg.innerText = "Login inválido";
  }
}

/* CARRINHO */
function add(nome, preco){
  carrinho.push(nome);
  total += preco;

  count.innerText = carrinho.length;

  items.innerHTML += `<div class="item">${nome} - R$ ${preco}</div>`;
  document.getElementById("total").innerText = total.toFixed(2);
}
</script>

</body>
</html>
