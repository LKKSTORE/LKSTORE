<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* TOP BAR NETFLIX STYLE */
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  z-index:1000;
  border-bottom:1px solid #222;
}

.logo{
  color:#00ff88;
  font-size:22px;
  font-weight:bold;
}

/* HERO */
.hero{
  margin-top:70px;
  padding:30px;
  background:linear-gradient(to right,#111,#000);
}

.hero h1{
  font-size:28px;
}

.hero p{
  opacity:0.8;
}

/* CATEGORIAS */
.section{
  padding:20px;
}

.section h2{
  margin-bottom:15px;
}

/* CARDS NETFLIX STYLE */
.row{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding-bottom:10px;
}

.card{
  min-width:180px;
  background:#111;
  border-radius:12px;
  padding:10px;
  transition:0.3s;
  flex-shrink:0;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:90px;
  object-fit:contain;
}

.card h3{
  font-size:14px;
}

.card button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:6px;
  background:#00ff88;
  font-weight:bold;
  cursor:pointer;
}

/* SIDEBAR CARRINHO HOTMART STYLE */
#cart{
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:260px;
  background:#111;
  padding:15px;
  border-left:1px solid #222;
  overflow:auto;
}

.item{
  font-size:13px;
  margin:5px 0;
  opacity:0.9;
}

.total{
  margin-top:10px;
  color:#00ff88;
  font-weight:bold;
}

/* LOGIN FULLSCREEN */
#login{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  margin-top:8px;
}

/* MOBILE */
@media(max-width:768px){
  #cart{
    width:200px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h2>LKSTORE</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
    <p id="msg"></p>
  </div>
</div>

<header>
  <div class="logo">LKSTORE</div>
  <div>🛒 <span id="count">0</span></div>
</header>

<div class="hero">
  <h1>Bem-vindo à LKSTORE</h1>
  <p>Streaming e produtos digitais instantâneos</p>
</div>

<!-- CATEGORIA 1 -->
<div class="section">
  <h2>🔥 Mais populares</h2>
  <div class="row">

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
      <h3>Netflix</h3>
      <button onclick="add('Netflix',19.90)">Comprar</button>
    </div>

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
      <h3>Disney+</h3>
      <button onclick="add('Disney+',15.90)">Comprar</button>
    </div>

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
      <h3>Prime Video</h3>
      <button onclick="add('Prime Video',14.90)">Comprar</button>
    </div>

  </div>
</div>

<!-- CATEGORIA 2 -->
<div class="section">
  <h2>🎵 Música</h2>
  <div class="row">

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
      <h3>Spotify</h3>
      <button onclick="add('Spotify',9.90)">Comprar</button>
    </div>

  </div>
</div>

<!-- CARRINHO -->
<div id="cart">
  <h3>Carrinho</h3>
  <div id="items"></div>
  <div class="total">Total: R$ <span id="total">0</span></div>
</div>

<script>
let carrinho=[];
let total=0;

function register(){
  localStorage.setItem(user.value,pass.value);
  alert("Conta criada");
}

function login(){
  if(localStorage.getItem(user.value)===pass.value){
    login.style.display="none";
  }else{
    msg.innerText="Erro login";
  }
}

function add(nome,preco){
  carrinho.push(nome);
  total+=preco;

  count.innerText=carrinho.length;

  items.innerHTML += `<div class="item">${nome} - R$ ${preco}</div>`;
  document.getElementById("total").innerText=total.toFixed(2);
}
</script>

</body>
</html>
