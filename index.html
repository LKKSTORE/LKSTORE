
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKSTORE</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background: radial-gradient(circle at top, #1a0000, #000000);
      color:white;
    }

    /* NAVBAR */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 40px;
      background: rgba(0,0,0,0.7);
      border-bottom: 1px solid #ff1a1a33;
      position: sticky;
      top:0;
      backdrop-filter: blur(10px);
    }

    .logo{
      font-size:26px;
      font-weight:900;
      color:#ff1a1a;
      letter-spacing:2px;
    }

    nav a{
      color:#fff;
      margin-left:20px;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    nav a:hover{
      color:#ff1a1a;
    }

    /* HERO */
    .hero{
      padding:100px 20px;
      text-align:center;
    }

    .hero h1{
      font-size:60px;
      color:#ff1a1a;
      text-shadow:0 0 20px #ff1a1a55;
    }

    .hero p{
      margin-top:15px;
      font-size:18px;
      color:#cccccc;
    }

    .btn{
      margin-top:25px;
      padding:14px 30px;
      background: linear-gradient(90deg,#ff1a1a,#b30000);
      border:none;
      color:white;
      font-size:16px;
      cursor:pointer;
      border-radius:10px;
      transition:0.3s;
    }

    .btn:hover{
      transform: scale(1.05);
      box-shadow:0 0 20px #ff1a1a55;
    }

    /* PRODUCTS */
    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:25px;
      padding:50px;
    }

    .card{
      background: rgba(20,20,20,0.9);
      border:1px solid #ff1a1a33;
      padding:20px;
      border-radius:15px;
      text-align:center;
      transition:0.3s;
      box-shadow:0 0 10px #000;
    }

    .card:hover{
      transform: translateY(-8px);
      border-color:#ff1a1a;
      box-shadow:0 0 25px #ff1a1a33;
    }

    .card h3{
      color:#ff1a1a;
      margin-bottom:10px;
    }

    .card p{
      color:#ccc;
      font-size:14px;
    }

    .card button{
      margin-top:15px;
      padding:10px 20px;
      background:#ff1a1a;
      border:none;
      color:white;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .card button:hover{
      background:#b30000;
      transform:scale(1.05);
    }

    /* FOOTER */
    footer{
      text-align:center;
      padding:25px;
      color:#777;
      border-top:1px solid #ff1a1a22;
      margin-top:40px;
    }

  </style>
</head>
<body>

<header>
  <div class="logo">LKSTORE</div>
  <nav>
    <a href="#">Início</a>
    <a href="#">Produtos</a>
    <a href="#">Login</a>
  </nav>
</header>

<section class="hero">
  <h1>LKSTORE</h1>
  <p>Streaming • Conteúdos • Experiência Premium</p>
  <button class="btn">Explorar Agora</button>
</section>

<section class="products">

  <div class="card">
    <h3>Premium 1</h3>
    <p>Acesso completo ao streaming</p>
    <button>Comprar</button>
  </div>

  <div class="card">
    <h3>Premium 2</h3>
    <p>Conteúdos exclusivos HD</p>
    <button>Comprar</button>
  </div>

  <div class="card">
    <h3>Premium 3</h3>
    <p>Assinatura mensal VIP</p>
    <button>Comprar</button>
  </div>

</section>

<footer>
  © 2026 LKSTORE - Todos os direitos reservados
</footer>
<div id="loginBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;">
  
  <h2 style="color:red;">LKSTORE LOGIN</h2>

  <input id="user" placeholder="Usuário" style="padding:10px;margin:5px;">
  <input id="pass" type="password" placeholder="Senha" style="padding:10px;margin:5px;">

  <button onclick="login()" style="padding:10px 20px;background:red;color:white;border:none;">
    Entrar
  </button>

  <p id="msg" style="color:white;"></p>
</div>

<script>
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u && p){
    localStorage.setItem("logado", "sim");
    document.getElementById("loginBox").style.display = "none";
  } else {
    document.getElementById("msg").innerText = "Preencha tudo!";
  }
}

window.onload = function(){
  if(localStorage.getItem("logado") === "sim"){
    document.getElementById("loginBox").style.display = "none";
  }
}
</script>
</body>  
</html>
