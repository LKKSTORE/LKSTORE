<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0b0b0b;color:white;}

/* HEADER */
header{
display:flex;justify-content:space-between;
padding:15px;background:#111;
}

.logo{color:#ff3b3b;font-weight:bold;font-size:22px;}

.topIcons{display:flex;gap:10px;}

.icon{
width:40px;height:40px;
background:#222;border-radius:50%;
display:flex;align-items:center;justify-content:center;
cursor:pointer;position:relative;
}

.cart{background:#ff3b3b;}

#cartCount{
position:absolute;top:-5px;right:-5px;
background:white;color:black;
width:18px;height:18px;border-radius:50%;
font-size:12px;display:flex;align-items:center;justify-content:center;
}

/* PRODUTOS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;padding:20px;
}

.card{
background:#151515;
padding:15px;border-radius:10px;
text-align:center;
}

button{
padding:10px;
background:#ff3b3b;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

/* LOGIN */
#authBox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

.authCard{
background:#111;
padding:20px;
width:300px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">LKSTORE</div>

<div class="topIcons">
<div class="icon" onclick="abrirPerfil()">👤</div>
<div class="icon cart" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</div>
</div>
</header>

<!-- PRODUTOS -->
<div class="products">
<div class="card">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',6)">Comprar R$6</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',4)">Comprar R$4</button>
</div>
</div>

<!-- LOGIN -->
<div id="authBox">
<div class="authCard">
<h2>Login</h2>

<input id="loginUser" placeholder="Usuário">
<input id="loginPass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>
<button onclick="register()">Criar conta</button>
</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
apiKey: "SUA_API_KEY",
authDomain: "SEU_AUTH_DOMAIN",
projectId: "SEU_PROJECT_ID",
storageBucket: "SEU_STORAGE_BUCKET",
messagingSenderId: "SEU_SENDER_ID",
appId: "SEU_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* LOGIN */
function register(){
let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

db.collection("users").add({
email:user,
password:pass
});

alert("Conta criada!");
}

function login(){
let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

db.collection("users")
.where("email","==",user)
.where("password","==",pass)
.get()
.then(snap=>{
if(!snap.empty){
document.getElementById("authBox").style.display="none";
alert("Login OK!");
}else{
alert("Erro no login");
}
});
}

/* CARRINHO */
let cart=[];

function addToCart(name,price){
cart.push({name,price});
document.getElementById("cartCount").innerText=cart.length;
}

function toggleCart(){
alert("Carrinho: "+cart.length+" itens");
}
</script>

</body>
</html>
