<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}
.adm-btn{margin-top:5px;width:100%;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Email">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
    <div id="adminBtn" onclick="openAdmin()" style="display:none;">⚙️</div>
  </div>
</header>

<!-- ANÚNCIO -->
<div id="anuncio" class="banner">
🔥 Bem-vindo à LKSTORE
</div>

<!-- PRODUTOS -->
<div class="products">

 <div class="card">
  <h4>Netflix</h4>

  <button class="btn red comprarBtn" onclick="add('Netflix')">
    Comprar
  </button>

  <button class="adm-btn" onclick="editarNome(this)">✏️ Editar Nome</button>
  <button class="adm-btn" onclick="trocarImagem(this)">🖼️ Trocar Imagem</button>
  <button class="adm-btn" onclick="esgotarProduto(this)">🚫 Esgotar</button>
  <button class="adm-btn" onclick="this.parentElement.remove()">🗑️ Remover</button>
 </div>

</div>

<!-- MODAL PRODUTO -->
<div id="modalAddProduto" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
">

  <div style="background:#fff;color:#000;padding:20px;border-radius:10px;width:300px;">
    <h3>Adicionar Produto</h3>

    <input id="nomeProduto" placeholder="Nome">
    <input id="precoProduto" placeholder="Preço">
    <input id="imgProduto" placeholder="Imagem URL">

    <button onclick="adicionarProduto()">Salvar</button>
    <button onclick="fecharAddProduto()">Fechar</button>
  </div>
</div>

<script>

let isAdmin = false;
let userLogado = "";
let carrinho = [];

const ADMIN_EMAIL = "ls4619058@gmail.com";

/* LOGIN */
function register(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  localStorage.setItem("u_"+u,p);
  alert("Conta criada!");
}

function loginUser(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("u_"+u) === p){

    userLogado = u;
    localStorage.setItem("email", u); // IMPORTANTE
    document.getElementById("userLogin").style.display = "none";

    if(u === ADMIN_EMAIL){
      isAdmin = true;
      document.getElementById("adminBtn").style.display = "block";
    }

  } else {
    alert("Login inválido");
  }
}

/* PRODUTOS */
function esgotarProduto(botao){
  let card = botao.parentElement;
  let btnComprar = card.querySelector(".comprarBtn");

  if(btnComprar){
    btnComprar.innerHTML = "🚫 ESGOTADO";
    btnComprar.disabled = true;
  }
}

function editarNome(botao){
  let novoNome = prompt("Novo nome:");
  if(!novoNome) return;
  botao.parentElement.querySelector("h4").innerText = novoNome;
}

function trocarImagem(botao){
  let url = prompt("URL da imagem:");
  if(!url) return;
  let img = botao.parentElement.querySelector("img");
  if(img) img.src = url;
}

/* CARRINHO */
function add(nome){
  carrinho.push(nome);
  document.getElementById("count").innerText = carrinho.length;
}

function openCart(){
  alert("Carrinho: " + carrinho.join(", "));
}

/* ADMIN */
function openAdmin(){
  if(!isAdmin) return alert("Negado");
  alert("Painel ADM");
}

/* ANÚNCIO */
function mudarAnuncio(){
  if(!isAdmin) return alert("Apenas ADM");

  let novo = prompt("Digite o novo anúncio:");
  if(!novo) return;

  document.getElementById("anuncio").innerText = novo;
  localStorage.setItem("anuncio", novo);
}

/* carregar anúncio */
document.addEventListener("DOMContentLoaded", function () {
  let salvo = localStorage.getItem("anuncio");
  if (salvo) {
    document.getElementById("anuncio").innerText = salvo;
  }

  const emailLogado = localStorage.getItem("email");

  if (emailLogado === ADMIN_EMAIL) {
    isAdmin = true;
    document.getElementById("adminBtn").style.display = "block";
  }

  if (!isAdmin) {
    document.querySelectorAll(".adm-btn").forEach(btn => {
      btn.style.display = "none";
    });
  }
});

/* MODAL PRODUTO */
function abrirAddProduto(){
  document.getElementById("modalAddProduto").style.display = "flex";
}

function fecharAddProduto(){
  document.getElementById("modalAddProduto").style.display = "none";
}

function adicionarProduto(){
  alert("Produto adicionado (exemplo)");
  fecharAddProduto();
}

</script>

</body>
</html>
