<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  padding:15px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:22px;
}

.topIcons{
  display:flex;
  gap:15px;
  align-items:center;
}

/* PRODUTOS estilo Netflix */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  transition:0.3s;
  border:1px solid #222;
}

.card:hover{
  transform:scale(1.05);
  border:1px solid red;
}

.card img{
  height:70px;
}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* BANNERS */
.banner{
  background:#111;
  margin:10px;
  padding:15px;
  border-left:4px solid red;
  border-radius:10px;
}

.grande{font-size:20px;font-weight:bold;}
.medio{font-size:16px;}
.pequeno{font-size:14px;opacity:0.8;}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:320px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

.authCard button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

/* CARRINHO */
#cartBox{
  display:none;
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  width:320px;
  border-radius:12px;
  border:1px solid red;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
  border-bottom:1px solid #222;
  padding-bottom:5px;
}

.remove{
  color:red;
  cursor:pointer;
}

/* BOTÃO FINALIZAR */
.finalizar{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LKSTORE LOGIN</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
    <p id="msg"></p>
  </div>
</div>

<header>
  <div class="logo">LKSTORE</div>
  <div>🛒 <span id="count">0</span></div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify')">Comprar</button>
  </div>

</div>

<!-- AVISOS -->
<div class="banner grande">🔒 PAGAMENTO 100% SEGURO</div>
<div class="banner medio">⚡ ENTREGA IMEDIATA AUTOMÁTICA</div>
<div class="banner pequeno">💬 SUPORTE VIA WHATSAPP</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <button class="finalizar" onclick="finalizar()">Finalizar Compra</button>
</div>

<script>

let carrinho = [];
let logado = false;

/* LOGIN */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  alert("Conta criada!");
}

function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    logado = true;
    authBox.style.display = "none";
  } else {
    msg.innerText = "Login inválido";
  }
}

/* CARRINHO */
function add(prod){
  if(!logado){
    alert("Faça login primeiro!");
    return;
  }

  carrinho.push(prod);
  atualizar();
}

/* ATUALIZAR CARRINHO */
function atualizar(){
  count.innerText = carrinho.length;

  cartItems.innerHTML = "";

  carrinho.forEach((item, i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        <span>${item}</span>
        <span class="remove" onclick="remover(${i})">X</span>
      </div>
    `;
  });
}

/* REMOVER ITEM */
function remover(i){
  carrinho.splice(i,1);
  atualizar();
}

/* FINALIZAR */
function finalizar(){
  if(carrinho.length === 0){
    alert("Carrinho vazio!");
    return;
  }
  alert("Compra finalizada com sucesso!");
  carrinho = [];
  atualizar();
}

</script>

</body>
</html>
