<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:2px solid red;
  z-index:1000;
  gap:10px;
}

.logo{
  color:red;
  font-weight:bold;
  font-size:20px;
}

.searchBar{
  flex:1;
  margin:0 10px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#111;
  color:white;
}

.topIcons{
  display:flex;
  align-items:center;
  gap:8px;
}

.profileBtn{
  font-size:22px;
  cursor:pointer;
  padding:6px 10px;
}

.cartBtn{
  background:red;
  color:white;
  padding:8px 12px;
  border-radius:50px;
  cursor:pointer;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:bold;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
  border:1px solid #222;
}

.card img{
  height:70px;
}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

/* CARRINHO LATERAL */
#cartBox{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:3000;
  padding:15px;
}

#cartBox.open{
  right:0;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  border-bottom:1px solid #222;
  padding-bottom:5px;
}

.remove{
  color:red;
  cursor:pointer;
}

.finalizar{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* PERFIL */
.sidePanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  border-left:2px solid red;
  transition:0.3s;
  z-index:4000;
  padding:15px;
}

.sidePanel.open{
  right:0;
}

/* LOGIN */
#authBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

/* BANNER */
.banner{
  background:#111;
  margin:10px auto;
  padding:15px;
  border-left:4px solid red;
  border-radius:10px;
  max-width:700px;
  text-align:center;
}

.grande{font-size:20px;font-weight:bold;}
.medio{font-size:16px;}
.pequeno{font-size:14px;opacity:0.8;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LKSTORE LOGIN</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE</div>

  <input class="searchBar" placeholder="Buscar produtos...">

  <div class="topIcons">
    <div class="profileBtn" onclick="togglePerfil()">👤</div>

    <div class="cartBtn" onclick="toggleCart()">
      🛒 <span id="count">0</span>
    </div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video')">Comprar</button>
  </div>

</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>
  <button class="finalizar" onclick="finalizar()">Finalizar Compra</button>
</div>

<!-- PERFIL -->
<div id="profileBox" class="sidePanel">

  <div style="display:flex;justify-content:space-between;">
    <h3>👤 Perfil</h3>
    <span onclick="togglePerfil()" style="cursor:pointer;">✖</span>
  </div>

  <p>🧾 Minha conta</p>
  <p>🛒 Meus pedidos</p>
  <p>⚙️ Configurações</p>
  <p onclick="logout()" style="color:red;cursor:pointer;">🚪 Sair</p>

</div>

<!-- AVISOS -->
<div style="margin-top:40px; text-align:center; padding:20px;">
  <div class="banner grande">🔒 PAGAMENTO 100% SEGURO</div>
  <div class="banner medio">⚡ ENTREGA AUTOMÁTICA</div>
  <div class="banner pequeno">💬 SUPORTE VIA WHATSAPP</div>
</div>

<script>

let carrinho = [];
let logado = false;

/* LOGIN */
function register(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  localStorage.setItem("user_"+u, p);
  alert("Conta criada!");
}

function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("user_"+u) === p){
    logado = true;
    document.getElementById("authBox").style.display = "none";
  } else {
    alert("Login inválido");
  }
}

/* CARRINHO */
function add(prod){
  if(!logado){
    alert("Faça login primeiro!");
    return;
  }

  carrinho.push(prod);
  document.getElementById("count").innerText = carrinho.length;
  renderCart();
}

function toggleCart(){
  document.getElementById("cartBox").classList.toggle("open");
  renderCart();
}

function renderCart(){
  let box = document.getElementById("cartItems");
  box.innerHTML = "";

  carrinho.forEach((item, i)=>{
    box.innerHTML += `
      <div class="cartItem">
        ${item}
        <span class="remove" onclick="removeItem(${i})">x</span>
      </div>
    `;
  });
}

function removeItem(i){
  carrinho.splice(i,1);
  document.getElementById("count").innerText = carrinho.length;
  renderCart();
}

function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  document.getElementById("count").innerText = 0;
  renderCart();
}

/* PERFIL */
function togglePerfil(){
  document.getElementById("profileBox").classList.toggle("open");
}

function logout(){
  alert("Saiu da conta");
  location.reload();
}

</script>

</body>
</html>
