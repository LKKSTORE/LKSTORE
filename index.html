<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
  padding-top:80px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:2px solid red;
  z-index:1000;
}

.logo{
  color:red;
  font-size:22px;
  font-weight:bold;
}

.cartBtn{
  background:#111;
  border:1px solid red;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  width:220px;
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.card img{
  height:70px;
}

.card button{
  width:100%;
  padding:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* AVISOS */
.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  border-radius:10px;
}

.grande{font-size:20px;font-weight:bold;}
.medio{font-size:16px;}
.pequeno{font-size:14px;opacity:0.8;}

/* CARRINHO */
#cartBox{
  display:none;
  position:fixed;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  width:320px;
  border-radius:12px;
  border:1px solid red;
  z-index:2000;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
}

.remove{
  color:red;
  cursor:pointer;
}

/* LOGIN */
#authBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.authCard{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:320px;
  border:1px solid red;
}

.authCard input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

.authCard button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
  <div class="authCard">
    <h2 style="color:red;">LOGIN LKSTORE</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="register()">Criar conta</button>

    <p id="msg"></p>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE</div>

  <div class="cartBtn" onclick="toggleCart()">
    🛒 <span id="count">0</span>
  </div>
</header>

<!-- AVISOS (ANTES DO LOGIN) -->
<div class="banner grande">🔒 PAGAMENTO 100% SEGURO</div>
<div class="banner medio">⚡ ENTREGA AUTOMÁTICA NA HORA</div>
<div class="banner pequeno">💬 SUPORTE VIA WHATSAPP 24H</div>

<!-- PRODUTOS (VISÍVEIS SEM LOGIN) -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="add('Netflix')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="add('Disney+')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="add('Prime Video')">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg">
    <h3>Spotify</h3>
    <button onclick="add('Spotify')">Comprar</button>
  </div>

</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="cartItems"></div>

  <button onclick="finalizar()" style="width:100%;padding:10px;background:red;color:white;border:none;border-radius:8px;">
    Finalizar Compra
  </button>
</div>

<script>
let carrinho = [];
let logado = false;

/* abrir login só quando precisar */
function abrirLogin(){
  authBox.style.display = "flex";
}

/* register */
function register(){
  localStorage.setItem("user_"+user.value, pass.value);
  msg.innerText = "Conta criada!";
}

/* login */
function login(){
  if(localStorage.getItem("user_"+user.value) === pass.value){
    logado = true;
    authBox.style.display = "none";
  } else {
    msg.innerText = "Erro no login";
  }
}

/* comprar */
function add(prod){
  if(!logado){
    abrirLogin();
    alert("Crie conta para comprar!");
    return;
  }

  carrinho.push(prod);
  count.innerText = carrinho.length;
  render();
}

/* carrinho */
function render(){
  cartItems.innerHTML = "";

  carrinho.forEach((item,i)=>{
    cartItems.innerHTML += `
      <div class="cartItem">
        ${item}
        <span class="remove" onclick="removeItem(${i})">X</span>
      </div>
    `;
  });
}

/* remover */
function removeItem(i){
  carrinho.splice(i,1);
  count.innerText = carrinho.length;
  render();
}

/* abrir carrinho */
function toggleCart(){
  cartBox.style.display =
    cartBox.style.display === "block" ? "none" : "block";
}

/* finalizar */
function finalizar(){
  alert("Compra finalizada!");
  carrinho = [];
  count.innerText = 0;
  render();
}
</script>

</body>
</html>
