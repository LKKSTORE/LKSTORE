<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO MAX</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

button{cursor:pointer}

/* LOGIN SCREENS */
.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

/* LAYOUT */
.products{
  padding:20px;
}

.card{
  background:#111;
  padding:10px;
  border-radius:10px;
  width:200px;
}

/* SIDEPANEL ADMIN */
#adminPanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  border-left:2px solid red;
  z-index:5000;
}

#adminPanel.open{right:0;}

.close{
  float:right;
  cursor:pointer;
}

/* PROFILE */
#profile{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:4000;
}

#profile.open{right:0;}
</style>
</head>

<body>

<!-- 🔐 LOGIN USER -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN USUÁRIO</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>

    <hr>

    <button class="btn gray" onclick="openAdminLogin()">⚙️ Login Admin</button>
  </div>
</div>

<!-- 🔐 LOGIN ADMIN -->
<div id="adminLogin" class="screen" style="display:none;">
  <div class="box">
    <h3>LOGIN ADMIN</h3>

    <input id="adminPass" type="password" placeholder="Senha admin">

    <button class="btn red" onclick="loginAdmin()">Entrar Admin</button>
    <button class="btn gray" onclick="closeAdminLogin()">Voltar</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div>
    <button onclick="openProfile()">👤 Perfil</button>
    <button onclick="openAdmin()">⚙️ Admin</button>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">
  <div class="card">
    Netflix
    <button class="btn red">Comprar</button>
  </div>
</div>

<!-- PERFIL -->
<div id="profile">
  <span class="close" onclick="openProfile()">✖</span>

  <h3>Perfil</h3>

  <p>Usuário: <span id="userName">---</span></p>

  <p onclick="afiliado()">🤝 Afiliado</p>
  <p>🛒 Minhas compras</p>
  <p onclick="logout()" style="color:red;">Sair</p>

  <p id="dono" style="display:none;color:gray;">
    Dono: ls4619058@gmail.com
  </p>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <span class="close" onclick="openAdmin()">✖</span>

  <h3>ADMIN</h3>

  <p>✔ Painel liberado</p>
  <p id="adminStatus">Bloqueado</p>
</div>

<script>

let isAdmin = false;
let userLogado = "";

/* USER LOGIN */
function register(){
  localStorage.setItem("u_"+user.value, pass.value);
  alert("Conta criada!");
}

function loginUser(){

  if(localStorage.getItem("u_"+user.value) === pass.value){

    userLogado = user.value;

    document.getElementById("userLogin").style.display="none";
    document.getElementById("userName").innerText = userLogado;

  } else {
    alert("Erro login");
  }
}

/* ADMIN LOGIN SCREEN */
function openAdminLogin(){
  document.getElementById("adminLogin").style.display="flex";
}

function closeAdminLogin(){
  document.getElementById("adminLogin").style.display="none";
}

/* ADMIN LOGIN */
function loginAdmin(){

  let pass = document.getElementById("adminPass").value;

  if(pass === "1234"){
    isAdmin = true;

    document.getElementById("adminStatus").innerText = "LIBERADO ✔";
    document.getElementById("dono").style.display = "block";

    closeAdminLogin();

    alert("Admin liberado!");
  } else {
    alert("Senha errada");
  }
}

/* ADMIN PANEL */
function openAdmin(){

  if(!isAdmin){
    alert("Acesso negado");
    return;
  }

  document.getElementById("adminPanel").classList.toggle("open");
}

/* PROFILE */
function openProfile(){
  document.getElementById("profile").classList.toggle("open");
}

/* AFILIADO */
function afiliado(){

  if(isAdmin){
    alert("Afiliado liberado");
  } else {
    alert("Bloqueado - precisa admin");
  }
}

/* LOGOUT */
function logout(){
  location.reload();
}

</script>

</body>
</html>
