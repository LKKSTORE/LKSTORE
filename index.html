<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

/* LOGIN */
.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.red{background:red;}
.gray{background:#333;}

/* LOADING */
#loading{
  display:none;
  text-align:center;
  margin-top:10px;
  color:lime;
}

/* ADM */
.adminPanel{
  position:fixed;
  bottom:10px;
  right:10px;
  background:#111;
  padding:10px;
  border-radius:10px;
  border:1px solid red;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <div class="box">
    <h3>LOGIN</h3>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>

    <div id="loading">⏳ Entrando...</div>
  </div>
</div>

<header>
  <div class="logo">LKSTORE PRO</div>
</header>

<div class="products"></div>

<!-- ADM -->
<div id="adminPanel" class="adminPanel" style="display:none;">
  <button onclick="abrirAddProduto()">➕ Produto</button>
</div>

<!-- MODAL PRODUTO -->
<div id="modalAddProduto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:#fff;padding:20px;border-radius:10px;width:300px;color:black;">
    <h3>Adicionar Produto</h3>

    <input id="nomeProduto" placeholder="Nome">
    <input id="precoProduto" placeholder="Preço">
    <input id="imgProduto" placeholder="Imagem URL">

    <button onclick="adicionarProduto()">Salvar</button>
    <button onclick="fecharAddProduto()">Fechar</button>
  </div>
</div>

<script>

/* ===== USUÁRIO ===== */
let userLogado = "";
let isAdmin = false;
const ADMIN_USER = "admin";

/* ===== DADOS ===== */
let produtos = JSON.parse(localStorage.getItem("produtos") || "[]");
let users = JSON.parse(localStorage.getItem("users") || "{}");

/* ===== REGISTER ===== */
function register(){

  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  if(!u || !p) return alert("Preencha tudo");

  users = JSON.parse(localStorage.getItem("users") || "{}");

  if(users[u]) return alert("Usuário já existe");

  users[u] = p;
  localStorage.setItem("users", JSON.stringify(users));

  alert("Conta criada!");
}

/* ===== LOGIN (CORRIGIDO + FEEDBACK) ===== */
function loginUser(){

  let u = document.getElementById("user").value.trim();
  let p = document.getElementById("pass").value.trim();

  let loading = document.getElementById("loading");
  loading.style.display = "block";

  users = JSON.parse(localStorage.getItem("users") || "{}");

  setTimeout(() => {

    if(users[u] && users[u] === p){

      userLogado = u;
      isAdmin = (u === ADMIN_USER);

      document.getElementById("loginScreen").style.display = "none";

      if(isAdmin){
        document.getElementById("adminPanel").style.display = "block";
      }

      renderizar();

    } else {
      alert("Usuário ou senha inválidos!");
    }

    loading.style.display = "none";

  }, 800);
}

/* ===== PRODUTOS ===== */
function salvar(){
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

function renderizar(){

  const container = document.querySelector(".products");
  container.innerHTML = "";

  produtos.forEach(p => {

    container.innerHTML += `
      <div class="card">

        ${p.img ? `<img src="${p.img}" width="100%">` : ""}

        <h4>${p.nome}</h4>
        <p>R$ ${p.preco}</p>

        <p>${p.esgotado ? "🚫 ESGOTADO" : "✅ DISPONÍVEL"}</p>

        ${isAdmin ? `
          <button onclick="editar(${p.id})">✏️ Editar</button>
          <button onclick="remover(${p.id})">🗑️ Remover</button>
        ` : ""}

        ${p.esgotado ? `
          <button disabled>🚫 Esgotado</button>
        ` : `
          <button onclick="comprar(${p.id})">💳 Comprar</button>
        `}

      </div>
    `;
  });
}

/* ===== COMPRA ===== */
function comprar(id){

  let p = produtos.find(x => x.id === id);
  if(!p) return;

  window.open("https://link.mercadopago.com.br/lkkstore", "_blank");
}

/* ===== ADM ===== */
function abrirAddProduto(){
  document.getElementById("modalAddProduto").style.display = "flex";
}

function fecharAddProduto(){
  document.getElementById("modalAddProduto").style.display = "none";
}

function adicionarProduto(){

  let nome = document.getElementById("nomeProduto").value;
  let preco = document.getElementById("precoProduto").value;
  let img = document.getElementById("imgProduto").value;

  produtos.push({
    id:Date.now(),
    nome,
    preco,
    img,
    esgotado:false
  });

  salvar();
  renderizar();
  fecharAddProduto();
}

function editar(id){

  let p = produtos.find(x => x.id === id);

  let nome = prompt("Nome", p.nome);
  let preco = prompt("Preço", p.preco);

  produtos = produtos.map(x =>
    x.id === id ? {...x, nome, preco} : x
  );

  salvar();
  renderizar();
}

function remover(id){
  produtos = produtos.filter(p => p.id !== id);
  salvar();
  renderizar();
}

renderizar();

</script>

</body>
</html>
