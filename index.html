<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{
  display:flex;
  gap:10px;
  align-items:center;
}

.topIcons div{
  cursor:pointer;
  font-size:22px;
}

/* PRODUTOS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.card img{height:60px;}

/* LOGIN */
.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

/* BOTÕES */
.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

/* ADMIN */
#adminPanel{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  border-left:2px solid red;
  z-index:5000;
}

#adminPanel.open{right:0;}

/* PROFILE */
#profile{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:4000;
}

#profile.open{right:0;}

/* MENU */
.menu div{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

/* CLOSE */
.close{
  float:right;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN USUÁRIO -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>

    <hr>

    <button class="btn gray" onclick="openAdminLogin()">⚙️ Admin</button>
  </div>
</div>

<!-- LOGIN ADMIN -->
<div id="adminLogin" class="screen" style="display:none;">
  <div class="box">
    <h3>LOGIN ADMIN</h3>

    <input id="adminPass" type="password" placeholder="Senha admin">

    <button class="btn red" onclick="loginAdmin()">Entrar</button>
    <button class="btn gray" onclick="closeAdminLogin()">Voltar</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openProfile()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
    <div id="adminBtn" style="display:none;" onclick="openAdmin()">⚙️</div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products"></div>

<!-- PERFIL -->
<div id="profile" class="sidePanel">
  <span class="close" onclick="openProfile()">✖</span>

  <h3>👤 Perfil</h3>
  <p>Usuário: <span id="userName">---</span></p>

  <div class="menu">
    <div>🧾 Minha conta</div>
    <div>🛒 Minhas compras</div>
    <div>🤝 Afiliado</div>
    <div onclick="logout()" style="color:red;">🚪 Sair</div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPanel">
  <span class="close" onclick="openAdmin()">✖</span>

  <h3>⚙️ ADMIN</h3>

  <h4>➕ Adicionar Produto</h4>
  <input id="nomeProd" placeholder="Nome">
  <input id="imgProd" placeholder="Imagem URL">
  <button class="btn red" onclick="adicionarProduto()">Adicionar</button>

  <hr>

  <div id="listaAdmin"></div>
</div>

<script>

/* 🔥 PRODUTOS SALVOS */
let produtos = JSON.parse(localStorage.getItem("produtos")) || [
  {nome:"Netflix", img:"https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"}
];

let carrinho = [];
let isAdmin = false;
let userLogado = "";

const ADMIN_PASS = "1234";

/* SALVAR */
function salvar(){
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

/* RENDER PRODUTOS */
function renderProdutos(){

  let box = document.querySelector(".products");
  box.innerHTML = "";

  produtos.forEach((p,i)=>{

    box.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h4>${p.nome}</h4>

        <button class="btn red" onclick="addCarrinho('${p.nome}')">
          Comprar
        </button>

        ${isAdmin ? `<button class="btn gray" onclick="remover(${i})">Remover</button>` : ""}
      </div>
    `;
  });

  renderAdminList();
}

/* ADMIN LIST */
function renderAdminList(){

  let box = document.getElementById("listaAdmin");
  if(!box) return;

  box.innerHTML = "<h4>📦 Produtos</h4>";

  produtos.forEach((p,i)=>{
    box.innerHTML += `
      <p>${p.nome}
      <button onclick="remover(${i})">X</button></p>
    `;
  });
}

/* ADD PRODUTO */
function adicionarProduto(){

  let nome = document.getElementById("nomeProd").value;
  let img = document.getElementById("imgProd").value;

  produtos.push({nome,img});
  salvar();
  renderProdutos();
}

/* REMOVER */
function remover(i){
  produtos.splice(i,1);
  salvar();
  renderProdutos();
}

/* CARRINHO */
function addCarrinho(nome){
  carrinho.push(nome);
  document.getElementById("count").innerText = carrinho.length;
}

/* LOGIN USER */
function register(){
  localStorage.setItem("u_"+user.value, pass.value);
  alert("Conta criada!");
}

function loginUser(){

  if(localStorage.getItem("u_"+user.value) === pass.value){

    userLogado = user.value;

    document.getElementById("userLogin").style.display="none";
    document.getElementById("userName").innerText=userLogado;

    renderProdutos();

  } else {
    alert("Erro login");
  }
}

/* ADMIN */
function openAdminLogin(){
  document.getElementById("adminLogin").style.display="flex";
}

function closeAdminLogin(){
  document.getElementById("adminLogin").style.display="none";
}

function loginAdmin(){

  if(document.getElementById("adminPass").value === ADMIN_PASS){

    isAdmin = true;

    document.getElementById("adminBtn").style.display="block";

    closeAdminLogin();

    renderProdutos();

    alert("Admin liberado!");

  } else {
    alert("Senha errada");
  }
}

/* PANELS */
function openAdmin(){
  document.getElementById("adminPanel").classList.toggle("open");
}

function openProfile(){
  document.getElementById("profile").classList.toggle("open");
}

function openCart(){
  alert("Carrinho: " + carrinho.length);
}

function logout(){
  location.reload();
}

/* INIT */
renderProdutos();

</script>

</body>
</html>
