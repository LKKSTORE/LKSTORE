<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0b;
  color: white;
  padding-top: 80px;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-between;
  padding: 15px;
  z-index: 1000;
}

.logo {
  color: #00ff88;
  font-weight: bold;
  font-size: 20px;
}

.topIcons {
  display: flex;
  gap: 15px;
  align-items: center;
}

.icon {
  cursor: pointer;
  font-size: 22px;
}

/* PRODUTOS */
.products {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: #111;
  width: 180px;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}

.card img {
  height: 60px;
  margin-bottom: 10px;
}

.card button {
  background: #00ff88;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

/* BANNERS */
.bannerLK {
  background: #111;
  margin: 10px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* CARRINHO */
#cartBox {
  display: none;
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  z-index: 2000;
}

/* OVERLAY */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1500;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #00ff88;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="overlay" onclick="fecharCart()"></div>

<header>
  <div class="logo">LKSTORE</div>

  <div class="topIcons">
    <div onclick="abrirCart()">🛒 <span id="count">0</span></div>
  </div>
</header>

<!-- PRODUTOS -->
<div class="products">

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
    <h3>Netflix</h3>
    <button onclick="adicionar('Netflix', 19.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg">
    <h3>Disney+</h3>
    <button onclick="adicionar('Disney+', 15.90)">Comprar</button>
  </div>

  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Prime_Video.png">
    <h3>Prime Video</h3>
    <button onclick="adicionar('Prime Video', 14.90)">Comprar</button>
  </div>

</div>

<!-- AVISOS MAIS PRA BAIXO -->
<div style="margin-top:40px;">
  <div class="bannerLK">🔒 PAGAMENTO 100% SEGURO</div>
  <div class="bannerLK">⚡ ENTREGA AUTOMÁTICA</div>
  <div class="bannerLK">💬 SUPORTE VIA WHATSAPP</div>
</div>

<!-- CARRINHO -->
<div id="cartBox">
  <h3>Carrinho</h3>
  <div id="itens"></div>
  <p>Total: R$ <span id="total">0</span></p>
  <button onclick="fecharCart()">Fechar</button>
</div>

<script>
let carrinho = [];

function adicionar(nome, preco) {
  carrinho.push({nome, preco});
  document.getElementById("count").innerText = carrinho.length;
  atualizar();
}

function atualizar() {
  let box = document.getElementById("itens");
  let total = 0;

  box.innerHTML = "";

  carrinho.forEach(item => {
    total += item.preco;
    box.innerHTML += `<p>${item.nome} - R$ ${item.preco}</p>`;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

function abrirCart() {
  document.getElementById("cartBox").style.display = "block";
  document.getElementById("overlay").style.display = "block";
}

function fecharCart() {
  document.getElementById("cartBox").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
