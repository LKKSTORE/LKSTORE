<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openPerfil()">👤</div>
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
  </div>
</header>

<div id="avisoLoja" class="banner">
🔥 Bem-vindo à LKSTORE
</div>

<!-- PRODUTOS -->
<div class="products"></div>

<!-- MODAL PRODUTO -->
<div id="modalAddProduto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;">
  <div style="background:#fff;padding:20px;border-radius:10px;width:300px;color:black;">
    <h3>Adicionar Produto</h3>

    <input id="nomeProduto" placeholder="Nome"><br><br>
    <input id="precoProduto" placeholder="Preço"><br><br>
    <input id="imgProduto" placeholder="Imagem URL"><br><br>

    <button onclick="adicionarProduto()">Salvar</button>
    <button onclick="fecharAddProduto()">Fechar</button>
  </div>
</div>

<!-- PERFIL -->
<div id="perfilModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
z-index:99999;
color:white;
padding:20px;
">

  <div style="background:#111;padding:20px;border-radius:10px;max-width:350px;margin:auto;">

    <h2>👤 Perfil</h2>

    <p id="perfilUser"></p>

    <button onclick="closePerfil()">❌ Fechar</button>
  </div>

</div>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let isAdmin = false;
let userLogado = "";
let carrinho = [];

const ADMIN_USER = "admin";

/* LOGIN */
function register(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(!u || !p) return alert("Preencha tudo");

  localStorage.setItem("u_" + u, p);
  alert("Conta criada!");
}

function loginUser(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("u_" + u) === p){

    userLogado = u;
    isAdmin = (u === ADMIN_USER);

    document.getElementById("userLogin").style.display = "none";

    renderizar();
    alert("Login realizado!");

  } else {
    alert("Login inválido");
  }
}

/* PERFIL */
function openPerfil(){

  const modal = document.getElementById("perfilModal");
  const user = document.getElementById("perfilUser");

  if(!modal || !user) return;

  modal.style.display = "block";
  user.innerText = "Usuário: " + userLogado;
}

function closePerfil(){
  document.getElementById("perfilModal").style.display = "none";
}

/* PRODUTOS */
function salvar(){
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

function renderizar(){

  const container = document.querySelector(".products");
  container.innerHTML = "";

  produtos.forEach(p => {

    container.innerHTML += `
      <div class="card">

        ${p.img ? `<img src="${p.img}" width="100%">` : ""}

        <h4>${p.nome}</h4>
        <p>R$ ${p.preco}</p>

        <p>${p.esgotado ? "🚫 ESGOTADO" : "✅ DISPONÍVEL"}</p>

        ${isAdmin ? `
          <button onclick="editarProdutoPrompt(${p.id})">✏️ Editar</button>
          <button onclick="alternarEsgotado(${p.id})">🚫 Esgotar</button>
          <button onclick="liberarAfiliado(${p.id})">🤝 Afiliado</button>
          <button onclick="removerProduto(${p.id})">🗑️ Remover</button>
        ` : ""}
<button onclick="registrarCompra(${p.id})">💳 Comprar</button>
      </div>
    `;
  });
}

function adicionarProduto(){

  let nome = document.getElementById("nomeProduto").value;
  let preco = document.getElementById("precoProduto").value;
  let img = document.getElementById("imgProduto").value;

  if(!nome || !preco) return alert("Preencha tudo");

  produtos.push({
    id: Date.now(),
    nome,
    preco,
    img,
    esgotado:false,
    afiliadoLiberado:false
  });

  salvar();
  renderizar();
  fecharAddProduto();
}

function editarProdutoPrompt(id){

  let p = produtos.find(x => x.id === id);
  if(!p) return;

  let nome = prompt("Nome:", p.nome);
  let preco = prompt("Preço:", p.preco);

  if(nome === null || preco === null) return;

  produtos = produtos.map(x =>
    x.id === id ? {...x, nome, preco} : x
  );

  salvar();
  renderizar();
}

function alternarEsgotado(id){
  produtos = produtos.map(p => {
    if(p.id === id) p.esgotado = !p.esgotado;
    return p;
  });

  salvar();
  renderizar();
}

function liberarAfiliado(id){
  produtos = produtos.map(p => {
    if(p.id === id) p.afiliadoLiberado = !p.afiliadoLiberado;
    return p;
  });

  salvar();
  renderizar();
}

function removerProduto(id){
  if(!confirm("Remover?")) return;

  produtos = produtos.filter(p => p.id !== id);
  salvar();
  renderizar();
}

/* MODAL */
function abrirAddProduto(){
  document.getElementById("modalAddProduto").style.display = "flex";
}

function fecharAddProduto(){
  document.getElementById("modalAddProduto").style.display = "none";
}

/* CARRINHO */
function add(nome){
  carrinho.push(nome);
  document.getElementById("count").innerText = carrinho.length;
}

function openCart(){
  alert(carrinho.join(", "));
}

renderizar();

 function logout(){
  userLogado = "";
  isAdmin = false;

  document.getElementById("userLogin").style.display = "flex";
}

  function mudarAnuncio(){

  let txt = prompt("Novo anúncio:");

  if(txt){
    document.getElementById("avisoLoja").innerText = txt;
  }
}
  function virarAfiliado(){

  if(!userLogado) return alert("Faça login");

  usuarios[userLogado] = usuarios[userLogado] || {};
  usuarios[userLogado].afiliado = true;

  localStorage.setItem("usuarios", JSON.stringify(usuarios));

  alert("Agora você é afiliado!");
}
  function registrarCompra(produto){

  vendas.push({
    user: userLogado,
    produto: produto.nome,
    valor: produto.preco,
    data: new Date().toLocaleString()
  });

  faturamento += Number(produto.preco);

  localStorage.setItem("vendas", JSON.stringify(vendas));
  localStorage.setItem("faturamento", JSON.stringify(faturamento));

  alert("Compra registrada!");
}
  function verHistorico(){

  let texto = vendas.map(v =>
    `${v.user} comprou ${v.produto} - R$${v.valor} (${v.data})`
  ).join("\n");

  alert(texto || "Sem vendas ainda");
}
  function verFaturamento(){
  alert("Faturamento total: R$ " + faturamento);
}
  function liberarAfiliado(id){

  produtos = produtos.map(p => {
    if(p.id === id){
      p.afiliadoLiberado = !p.afiliadoLiberado;
    }
    return p;
  });

  salvar();
  renderizar();
}

  function registrarCompra(id){
  let produto = produtos.find(p => p.id === id);
  if(!produto) return;
  
    let faturamento = JSON.parse(localStorage.getItem("faturamento")) || 0;
let vendas = JSON.parse(localStorage.getItem("vendas")) || [];
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || {};

function openPerfil(){

  const modal = document.getElementById("perfilModal");
  const user = document.getElementById("perfilUser");

  if(!modal || !user){
    alert("Perfil não encontrado no HTML");
    return;
  }

  modal.style.display = "block";
  user.innerText = "Usuário: " + userLogado;
}

function closePerfil(){
  document.getElementById("perfilModal").style.display = "none";
}
    
</script>
<div id="perfilModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
z-index:99999;
color:white;
padding:20px;
">

  <div style="background:#111;padding:20px;border-radius:10px;max-width:350px;margin:auto;">

    <h2>👤 Perfil</h2>

    <p id="perfilUser"></p>

    <br>

    <button onclick="virarAfiliado()">🤝 Virar Afiliado</button>
    <br><br>
    <button onclick="closePerfil()">❌ Fechar</button>

  </div>

</div>
</body>
</html>
