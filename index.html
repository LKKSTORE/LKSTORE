<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#000;
  border-bottom:2px solid red;
}

.logo{color:red;font-weight:bold;}

.topIcons{display:flex;gap:12px;align-items:center;}
.topIcons div{cursor:pointer;font-size:22px;}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:200px;
  background:#111;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  color:white;
}

.red{background:red;}
.gray{background:#333;}

.banner{
  margin:10px;
  padding:12px;
  background:#111;
  border-left:4px solid red;
  text-align:center;
}

/* ===== PAINEL ADM ===== */
#painelADM{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:99999;
  padding:20px;
}

.painelBox{
  background:#111;
  padding:20px;
  border-radius:10px;
  max-width:400px;
  margin:auto;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="userLogin" class="screen">
  <div class="box">
    <h3>LOGIN</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button class="btn red" onclick="loginUser()">Entrar</button>
    <button class="btn gray" onclick="register()">Criar conta</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">LKSTORE PRO</div>

  <div class="topIcons">
    <div onclick="openCart()">🛒 <span id="count">0</span></div>
    <div id="adminBtn" onclick="openAdmin()">⚙️</div>
  </div>
</header>

<!-- ANÚNCIO -->
<div id="anuncio" class="banner">
🔥 Bem-vindo à LKSTORE
</div>

<!-- PRODUTOS -->
<div class="products">

 <div class="card">
  <h4>Netflix</h4>

  <button class="btn red comprarBtn" onclick="add('Netflix')">
    Comprar
  </button>

  <button onclick="editarNome(this)">✏️ Editar Nome</button>
  <button onclick="trocarImagem(this)">🖼️ Trocar Imagem</button>
  <button onclick="esgotarProduto(this)">🚫 Esgotar</button>
  <button onclick="this.parentElement.remove()">🗑️ Remover</button>
 </div>

</div>

<!-- PAINEL ADM -->
<div id="painelADM">
  <div class="painelBox">

    <h2>⚙️ Painel ADM</h2>

    <button onclick="mudarAnuncio()">📢 Mudar Anúncio</button>
    <button onclick="alert('Função: adicionar produto')">➕ Adicionar Produto</button>
    <button onclick="alert('Função: liberar afiliado')">🤝 Afiliados</button>

    <br><br>

    <button onclick="fecharAdmin()">❌ Fechar</button>

  </div>
</div>

<script>

let isAdmin = false;
let carrinho = [];

const ADMIN_EMAIL = "ls4619058@gmail.com";

/* LOGIN */
function register(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  localStorage.setItem("u_"+u,p);
  alert("Conta criada!");
}

function loginUser(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(localStorage.getItem("u_"+u) === p){

    document.getElementById("userLogin").style.display = "none";

    if(u === ADMIN_EMAIL){
      isAdmin = true;
      document.getElementById("adminBtn").style.display = "block";
    }

  } else {
    alert("Login inválido");
  }
}

/* PRODUTOS */
function add(nome){
  carrinho.push(nome);
  document.getElementById("count").innerText = carrinho.length;
}

function openCart(){
  alert("Carrinho: " + carrinho.join(", "));
}

function editarNome(botao){
  if(!isAdmin) return alert("Negado");
  let novo = prompt("Novo nome:");
  if(novo) botao.parentElement.querySelector("h4").innerText = novo;
}

function trocarImagem(botao){
  if(!isAdmin) return alert("Negado");
  let url = prompt("URL:");
  if(url) botao.parentElement.querySelector("img")?.setAttribute("src", url);
}

function esgotarProduto(botao){
  let btn = botao.parentElement.querySelector(".comprarBtn");
  if(btn){
    btn.innerHTML = "🚫 ESGOTADO";
    btn.disabled = true;
  }
}

/* PAINEL ADM */
function openAdmin(){
  if(!isAdmin) return alert("Negado");
  document.getElementById("painelADM").style.display = "block";
}

function fecharAdmin(){
  document.getElementById("painelADM").style.display = "none";
}

/* ANÚNCIO */
function mudarAnuncio(){
  if(!isAdmin) return alert("Apenas ADM");

  let novo = prompt("Novo anúncio:");
  if(novo){
    document.getElementById("anuncio").innerText = novo;
    localStorage.setItem("anuncio", novo);
  }
}

</script>

</body>
</html>
