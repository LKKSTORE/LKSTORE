<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKSTORE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:linear-gradient(120deg,#2b0000,#8b0000,#000);
background-size:200% 200%;
animation:bgMove 8s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
display:flex;
justify-content:space-between;
padding:18px;
background:rgba(0,0,0,0.7);
position:sticky;
top:0;
}

.logo{color:red;font-size:26px;font-weight:900;}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
text-align:center;
}

.card button{
background:red;
color:white;
padding:10px;
border:none;
margin-top:10px;
cursor:pointer;
}

#cartBox{
position:fixed;
right:20px;
top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:240px;
}

#checkoutBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:10px;
width:320px;
z-index:9999;
}

/* LOGIN */
#authBox{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

button{cursor:pointer;}

</style>
</head>

<body>

<!-- LOGIN / CADASTRO -->
<div id="authBox">

<h2 style="color:red;">LKSTORE</h2>

<div id="loginBox">
<h3>Login</h3>
<input id="loginUser" placeholder="Usuário" style="padding:10px;margin:5px;">
<input id="loginPass" type="password" placeholder="Senha" style="padding:10px;margin:5px;">
<button onclick="login()" style="width:100%;padding:10px;background:red;color:white;">Entrar</button>
<p onclick="showRegister()" style="cursor:pointer;color:gray;">Criar conta</p>
</div>

<div id="registerBox" style="display:none;">
<h3>Cadastro</h3>
<input id="regUser" placeholder="Usuário" style="padding:10px;margin:5px;">
<input id="regPass" type="password" placeholder="Senha" style="padding:10px;margin:5px;">
<button onclick="register()" style="width:100%;padding:10px;background:red;color:white;">Cadastrar</button>
<p onclick="showLogin()" style="cursor:pointer;color:gray;">Já tenho conta</p>
</div>

</div>

<header>
<div class="logo">LKSTORE</div>
</header>

<section class="products">

<div class="card">
<h3>Premium 1</h3>
<button onclick="addToCart('Premium 1',1)">Comprar</button>
</div>

<div class="card">
<h3>Premium 2</h3>
<button onclick="addToCart('Premium 2',1)">Comprar</button>
</div>

<div class="card">
<h3>Premium 3</h3>
<button onclick="addToCart('Premium 3',1)">Comprar</button>
</div>

</section>

<!-- CARRINHO -->
<div id="cartBox">
<h3 style="color:red;">Carrinho</h3>

<div id="cartItems"></div>

<p>Total: R$ <span id="total">0</span></p>

<button onclick="abrirCheckout()" style="width:100%;padding:10px;background:gold;color:black;font-weight:bold;">
Checkout
</button>
</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<h3>🧾 Checkout</h3>

<div id="checkoutItems"></div>

<h4>Total: R$ <span id="checkoutTotal"></span></h4>

<h3>📧 E-mail</h3>
<input id="email" placeholder="Seu e-mail" style="width:100%;padding:8px;margin-bottom:10px;">

<h3>💳 PIX COPIA E COLA</h3>
<textarea id="pixCode" style="width:100%;height:80px;"></textarea>

<img id="pixQR" style="width:100%;margin-top:10px;">

<button onclick="copiarPix()" style="width:100%;padding:8px;background:red;color:white;">
Copiar Pix
</button>

<button onclick="confirmarCompra()" style="width:100%;padding:10px;background:green;color:white;margin-top:10px;">
Confirmar Compra
</button>

<button onclick="fecharCheckout()" style="width:100%;padding:10px;background:red;color:white;margin-top:5px;">
Fechar
</button>

</div>

<!-- SUPORTE -->
<a href="https://wa.me/5582991585655?text=Suporte LKSTORE" 
style="position:fixed;bottom:20px;right:20px;background:#25D366;padding:14px;border-radius:50px;color:white;text-decoration:none;">
💬 Suporte
</a>

<script>

let cart=[];

/* LOGIN */
function showRegister(){
document.getElementById("loginBox").style.display="none";
document.getElementById("registerBox").style.display="block";
}

function showLogin(){
document.getElementById("loginBox").style.display="block";
document.getElementById("registerBox").style.display="none";
}

function register(){
let u=document.getElementById("regUser").value;
let p=document.getElementById("regPass").value;

let users=JSON.parse(localStorage.getItem("users")||"[]");
users.push({u,p});
localStorage.setItem("users",JSON.stringify(users));

alert("Conta criada!");
showLogin();
}

function login(){
let u=document.getElementById("loginUser").value;
let p=document.getElementById("loginPass").value;

let users=JSON.parse(localStorage.getItem("users")||"[]");

let ok=users.find(x=>x.u===u && x.p===p);

if(ok){
localStorage.setItem("logado","1");
document.getElementById("authBox").style.display="none";
}else{
alert("Erro login!");
}
}

window.onload=function(){
if(localStorage.getItem("logado")==="1"){
document.getElementById("authBox").style.display="none";
}
}

/* CARRINHO */
function addToCart(n,p){
cart.push({n,p});
update();
}

function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
t+=i.p;
box.innerHTML+=`<p>${i.n} - R$ ${i.p}</p>`;
});

document.getElementById("total").innerText=t;
}

/* CHECKOUT */
function abrirCheckout(){
document.getElementById("checkoutBox").style.display="block";

let box=document.getElementById("checkoutItems");
box.innerHTML="";
let t=0;

cart.forEach(i=>{
box.innerHTML+=`<p>${i.n} - R$ ${i.p}</p>`;
t+=i.p;
});

document.getElementById("checkoutTotal").innerText=t;

let pix=`PIX-LKSTORE-${t}`;
document.getElementById("pixCode").value=pix;

document.getElementById("pixQR").src=
"https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+pix;
}

function fecharCheckout(){
document.getElementById("checkoutBox").style.display="none";
}

function copiarPix(){
navigator.clipboard.writeText(document.getElementById("pixCode").value);
alert("Copiado!");
}

/* FINAL */
function confirmarCompra(){
let email=document.getElementById("email").value;

if(!email){
alert("Digite e-mail!");
return;
}

alert("Compra registrada!");

cart=[];
update();
fecharCheckout();
}

</script>

</body>
</html>
